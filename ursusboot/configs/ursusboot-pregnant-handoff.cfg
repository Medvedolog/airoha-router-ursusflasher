# UrsusBoot transient pregnant handoff config.
# Stock tcboot never sees the OpenWrt pregnant FIT directly. It boots the
# hardware-proven stock FIT -> ARM64 Linux handoff shim. The shim starts this
# RAM-only UrsusBoot, which immediately bootm's the copied pregnant FIT.

# CONFIG_ENV_IS_IN_UBI is not set
# CONFIG_ENV_REDUNDANT is not set
CONFIG_ENV_IS_NOWHERE=y
# CONFIG_CMD_SAVEENV is not set
# CONFIG_CMD_ERASEENV is not set

# This image is a one-shot RAM handoff only. It must never enter Ursus Web
# recovery; tcboot remains the recovery/rollback authority. Keep LWIP compiled
# because the TEST61 command set links ursusweb.o unconditionally, but the
# pregnant dispatcher jumps to bootm before any web/network path can execute.
CONFIG_NET_LWIP=y
# CONFIG_CMD_PING is not set
# CONFIG_CMD_DHCP is not set
# CONFIG_CMD_DNS is not set
# CONFIG_CMD_SNTP is not set
# CONFIG_CMD_TFTPBOOT is not set
# CONFIG_CMD_WGET is not set

# Storage commands are also unnecessary here: the shim has already copied the
# pregnant FIT to RAM before UrsusBoot starts.
# CONFIG_CMD_MTD is not set
