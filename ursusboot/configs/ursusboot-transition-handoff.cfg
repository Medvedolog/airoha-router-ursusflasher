# UrsusBoot TRANSITION1 handoff-acceptance config.
# Applied after the frozen MD TEST61 config.  This profile is deliberately
# non-persistent: environment writes are disabled and no automatic boot target
# is stored in NAND/UBI.  NAND subsystems remain compiled for read-only
# geometry/identity diagnostics; controlled vanilla migration is a later gate.

# CONFIG_ENV_IS_IN_UBI is not set
# CONFIG_ENV_REDUNDANT is not set
CONFIG_ENV_IS_NOWHERE=y
# CONFIG_CMD_SAVEENV is not set
# CONFIG_CMD_ERASEENV is not set

# Destructive diagnostic commands are not required for Phase-A handoff.
# CONFIG_CMD_MTD_MARKBAD is not set
# CONFIG_CMD_MTD_NAND_WRITE_TEST is not set

# Keep MTD itself and `mtd list` for read-only geometry diagnostics.
CONFIG_CMD_MTD=y
CONFIG_MTD=y
CONFIG_DM_MTD=y
CONFIG_MTD_SPI_NAND=y

# Network/Web recovery capabilities required by Gate C.
CONFIG_NET_LWIP=y
CONFIG_CMD_PING=y
CONFIG_CMD_DHCP=y
CONFIG_CMD_WGET=y
