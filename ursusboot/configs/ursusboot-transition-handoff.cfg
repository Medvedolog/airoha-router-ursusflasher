# UrsusBoot TRANSITION2 no-UART handoff config.
# Applied after the frozen MD TEST61 config. This runtime is deliberately
# non-persistent: environment writes are disabled and no automatic boot target
# is stored in NAND/UBI. Stock tcboot selects SLOT2; the TRANSITION2 dispatcher
# then enters Ursus Web directly instead of chaining back into stock Linux.

# CONFIG_ENV_IS_IN_UBI is not set
# CONFIG_ENV_REDUNDANT is not set
CONFIG_ENV_IS_NOWHERE=y
# CONFIG_CMD_SAVEENV is not set
# CONFIG_CMD_ERASEENV is not set

# Keep normal compiled boot dispatch; TRANSITION2-specific Web entry is handled
# in cmd/ursusdispatch.c by URSUS_TRANSITION_WEB_ONLY.

# Destructive diagnostic commands are not required in the temporary runtime.
# CONFIG_CMD_MTD_MARKBAD is not set
# CONFIG_CMD_MTD_NAND_WRITE_TEST is not set

# Keep MTD itself and `mtd list` for geometry/identity diagnostics.
CONFIG_CMD_MTD=y
CONFIG_MTD=y
CONFIG_DM_MTD=y
CONFIG_MTD_SPI_NAND=y

# Network/Web recovery capabilities.
CONFIG_NET_LWIP=y
CONFIG_CMD_PING=y
CONFIG_CMD_DHCP=y
CONFIG_CMD_WGET=y

# TRANSITION enters U-Boot after stock tcboot has already exercised the FE/QDMA
# complex. Keep a larger RX ring here to avoid the Airoha small-ring completion
# stall where RX_DMA_IDX advances past the strictly sequential SW consumer.
# Persistent TEST61 remains at its hardware-proven value; this override is
# transition-only.
CONFIG_SYS_RX_ETH_BUFFER=32
