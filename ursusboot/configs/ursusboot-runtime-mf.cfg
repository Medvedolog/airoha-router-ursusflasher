# UrsusBoot persistent/runtime overlay for Nokia XG-040G-MF / AN7583.
# Common transport/MTD capabilities live in ursusboot-common.cfg.
# Runtime differs from RAM recovery by persistent UBI environment and UBI CLI.
# CONFIG_ENV_IS_NOWHERE is not set
CONFIG_ENV_IS_IN_UBI=y
CONFIG_ENV_REDUNDANT=y
CONFIG_ENV_SIZE=0x1f000
CONFIG_ENV_UBI_PART="ubi"
CONFIG_ENV_UBI_VOLUME="ubootenv"
CONFIG_ENV_UBI_VOLUME_REDUND="ubootenv2"
# This TEST61 source tree uses the modern text default-environment Kconfig
# interface. CONFIG_USE_DEFAULT_ENV_FILE/CONFIG_DEFAULT_ENV_FILE belong to a
# different U-Boot interface and disappear after olddefconfig, so do not assert
# them in the final-config contract.
CONFIG_ENV_USE_DEFAULT_ENV_TEXT_FILE=y
CONFIG_ENV_DEFAULT_ENV_TEXT_FILE="defenvs/an7583_nokia_xg-040g-mf_runtime_env"
CONFIG_CMD_UBI=y
CONFIG_CMD_UBI_RENAME=y
