# Airoha AN7583 SoC capability overlay.
# Board identity, NAND layout, environment policy and boot policy do not belong here.

# CONFIG_TARGET_AN7581 is not set
CONFIG_TARGET_AN7583=y
# CONFIG_PCS_AIROHA_AN7581 is not set
CONFIG_PCS_AIROHA_AN7583=y
# CONFIG_PINCTRL_AIROHA_AN7581 is not set
CONFIG_PINCTRL_AIROHA_AN7583=y
