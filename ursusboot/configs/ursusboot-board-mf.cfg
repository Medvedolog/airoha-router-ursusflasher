# Nokia XG-040G-MF / Airoha AN7583 board overlay.
# Only hardware identity and board-specific U-Boot selections belong here.

# CONFIG_TARGET_AN7581 is not set
CONFIG_TARGET_AN7583=y
CONFIG_DEFAULT_DEVICE_TREE="an7583-nokia-xg-040g-mf"
CONFIG_DEFAULT_FDT_FILE="an7583-nokia-xg-040g-mf.dtb"
# CONFIG_PCS_AIROHA_AN7581 is not set
CONFIG_PCS_AIROHA_AN7583=y
# CONFIG_PINCTRL_AIROHA_AN7581 is not set
CONFIG_PINCTRL_AIROHA_AN7583=y
