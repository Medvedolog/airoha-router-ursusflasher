# Nokia XG-040G-MD / Airoha AN7581 board overlay.
# Only hardware identity and board-specific U-Boot selections belong here.

CONFIG_TARGET_AN7581=y
# CONFIG_TARGET_AN7583 is not set
CONFIG_DEFAULT_DEVICE_TREE="airoha/an7581-nokia-xg-040g-md"
CONFIG_DEFAULT_FDT_FILE="airoha/an7581-nokia-xg-040g-md.dtb"
CONFIG_PCS_AIROHA_AN7581=y
# CONFIG_PCS_AIROHA_AN7583 is not set
CONFIG_PINCTRL_AIROHA_AN7581=y
# CONFIG_PINCTRL_AIROHA_AN7583 is not set
