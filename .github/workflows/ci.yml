name: CI
on:
  push:
    branches: [ main, master, feature/ursusboot-modular-airoha ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    name: verify (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 scripts/verify_boot_chain.py
      - run: python3 scripts/verify_repo.py
      - run: python3 scripts/build_release.py --out-dir dist
      - run: python3 scripts/verify_release.py dist
      - run: python3 scripts/build_public_release.py --out-dir dist-public
      - run: python3 scripts/verify_public_release.py dist-public
