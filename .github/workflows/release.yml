name: Release - full UrsusFlasher kit

# The counterpart to public-test-release.yml. That one publishes the pruned
# PUBLIC-TEST package under a test-* tag; this one publishes the complete kit
# that scripts/build_release.py produces, under a v* tag. Both refuse to
# overwrite an existing release, so a tag always names one set of bytes.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag. Leave empty for v<VERSION>"
        required: false
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify repository and boot-chain artifacts
        run: |
          python3 scripts/verify_boot_chain.py
          python3 scripts/verify_repo.py

      - name: Build the full kit
        run: python3 scripts/build_release.py --out-dir dist

      - name: Verify the built kit
        run: python3 scripts/verify_release.py dist

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [ -n "${REQUESTED_TAG:-}" ]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="v${VERSION}"
          fi
          # A v* tag is what the full kit is published under; test-* belongs to
          # public-test-release.yml, and mixing them makes the tag meaningless.
          case "$TAG" in
            v*) ;;
            *) echo "Full-release tag must start with v" >&2; exit 2 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=UrsusFlasher-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 3
          fi

      - name: Prepare release notes
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -euo pipefail
          DIGEST="$(awk '{print $1; exit}' "dist/${ASSET}.sha256.txt")"
          cat > dist/RELEASE_NOTES_RU.md <<EOF
          # UrsusFlasher ${VERSION}

          **Полный комплект для Nokia XG-040G-MD.**

          В отличие от PUBLIC-TEST сборки, этот asset содержит комплект целиком, как он лежит в репозитории.

          Для прошивки рекомендуется использовать **LAN2 или LAN3**. LAN1 работает через отдельный PHY EN8811H; LAN4 в комплектной OpenWrt-сборке после загрузки назначается WAN.

          **FUDAN1 остаётся HW_TEST_REQUIRED до отдельного аппаратного acceptance-прогона.**

          Перед использованием сверяйте SHA256 прикреплённого ZIP:

          \`\`\`text
          ${DIGEST}
          \`\`\`

          Проверка распакованного дерева выполняется через \`python3 scripts/verify_repo.py\`.
          EOF

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=(release create "$TAG"
            --target "$GITHUB_SHA"
            --title "UrsusFlasher ${VERSION}"
            --notes-file dist/RELEASE_NOTES_RU.md)
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}" \
            "dist/${ASSET}" \
            "dist/${ASSET}.sha256.txt" \
            "docs/INSTRUCTIONS_RU.md" \
            "docs/EMERGENCY_URSUSBOOT_RU.md" \
            "docs/CHANGELOG_RU.md"
