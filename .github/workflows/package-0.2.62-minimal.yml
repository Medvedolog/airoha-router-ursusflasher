name: Package UrsusFlasher 0.2.62 minimal hardware kit

on:
  push:
    branches:
      - feature/mf3-an7583-persistent
    paths:
      - '.github/workflows/package-0.2.62-minimal.yml'
      - 'scripts/**'
      - 'ursusflasher/src/**'
      - 'ursusflasher/release/**'
      - 'ursusboot/**'
      - 'config/**'
      - 'payloads/**'
      - 'fw/**'
      - 'docs/**'
      - 'VERSION'
      - 'START_ONECLICK.cmd'
      - 'START_ONECLICK.sh'
      - 'START_EXPERT.cmd'
      - 'START_EXPERT.sh'
      - 'START_UART_RESTORE.cmd'
      - 'START_UART_RESTORE.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Assert package version
        run: test "$(cat VERSION)" = "0.2.62"

      - name: Checkout pinned MedveFlasher hardware primitives
        uses: actions/checkout@v4
        with:
          repository: Medvedolog/nokia-router-medveflasher
          ref: 342cac4cb99a924f3d83eb8e4b5259490377704e
          path: work/medveflasher-rc35

      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends liblzma-dev

      - name: Verify canonical stock boot-area references
        run: |
          set -e
          MD=payloads/md/stock/nokia-xg-040g-md-stock-mtd0.bin
          MF=payloads/mf/stock/nokia-xg-040g-mf-stock-mtd0.bin
          test "$(stat -c %s "$MD")" = 524288
          test "$(sha256sum "$MD" | awk '{print $1}')" = c98f268db69fb3d8ab3ba7bd11f9aa0cc3bfbaacf5b952e7a4e25094476bb629
          test "$(stat -c %s "$MF")" = 524288
          test "$(sha256sum "$MF" | awk '{print $1}')" = 144d63272049eeb7122a01f2f3a0192b874ca4c68c10a5b4726fa4c2e84ac1bf
          echo STOCK_BOOTAREA_REFERENCES=PASS

      - name: Verify canonical eight-file UnameOne firmware set
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'openwrt-airoha-an7581-nokia_xg-040g-md-initramfs-uImage.itb': (8335560, '6696c96ef824defc56163f9fe4f2846fd4ab61cdbc5679415939d658071dca63'),
              'openwrt-airoha-an7581-nokia_xg-040g-md-squashfs-sysupgrade.bin': (8714513, '23ad06174184f71c9a845734571752f62930ba1cfac45f4ad8deadd9d8965820'),
              'openwrt-airoha-an7581-nokia_xg-040g-md-ubi-initramfs-recovery.itb': (8519680, '3ce8726e38f6dcdbdb6f25859e269ad32fe04201c5b57b064b11da7e469864fb'),
              'openwrt-airoha-an7581-nokia_xg-040g-md-ubi-squashfs-sysupgrade.itb': (10408217, '47ea7c6f1e22a4aae9482e653a4fc6e87524f7e27847aaaed7fb75349cae7f3d'),
              'openwrt-airoha-an7583-nokia_xg-040g-mf-initramfs-uImage.itb': (8180272, '92ad187fc271cce7e3a6e4556679f4307ceefdfc9db1ca2c34269d9ee3eba326'),
              'openwrt-airoha-an7583-nokia_xg-040g-mf-squashfs-sysupgrade.bin': (8540433, 'bd2a4947468ddd7ca71a42d36c7fd4462a24a1ceb6be4658f79c5c2bcb0ccf29'),
              'openwrt-airoha-an7583-nokia_xg-040g-mf-ubi-initramfs-recovery.itb': (8257536, '2d00595c7aab49d8f24de0d13374c6c3b479b846267dd3644fbb305db071f05c'),
              'openwrt-airoha-an7583-nokia_xg-040g-mf-ubi-squashfs-sysupgrade.itb': (10240281, '0043b450c1d8e311b6f6c12458c66e976a72cb93ed657e12029fa79fffe5dc3a'),
          }
          fw = Path('fw')
          actual = {p.name for p in fw.iterdir() if p.is_file() and p.name != 'README.md'}
          assert actual == set(expected), (sorted(actual), sorted(expected))
          for name, (size, sha) in expected.items():
              p = fw / name
              assert p.stat().st_size == size, (name, p.stat().st_size, size)
              assert hashlib.sha256(p.read_bytes()).hexdigest() == sha, name
          print('UNAMEONE_FW_8=PASS')
          PY

      - name: Rebuild frozen MD TEST61 reference
        env:
          JOBS: '2'
        run: |
          bash ursusboot/scripts/build_alpha5_test61.sh
          F=work/alpha5-test61-rebuild/out/ursusboot-md-0.1.0-alpha5-UBIUX1-TEST61-update.fip
          test "$(stat -c %s "$F")" = 503808
          test "$(sha256sum "$F" | awk '{print $1}')" = 3c922e4256b6047376a7d445006e6cb2a4485bb412747033a77defd15e42fcea
          cmp "$F" payloads/md/ursusboot/ursusboot-md-0.1.0-alpha5-UBIUX1-TEST61-update.fip
          echo MD_TEST61_FROZEN_REGRESSION=PASS

      - name: Build and audit MF RAM Recovery
        env:
          MF2_MEDVE_DIR: ${{ github.workspace }}/work/medveflasher-rc35
          JOBS: '2'
        run: |
          bash ursusboot/scripts/build_mf2_ramboot.sh
          python3 ursusboot/scripts/audit_mf2_ramboot_artifact.py work/mf-ramboot/out
          mkdir -p payloads/mf/recovery
          cp work/mf-ramboot/out/ursusboot-mf-0.1.0-TEST61-uart-preloader.bin payloads/mf/recovery/
          cp work/mf-ramboot/out/ursusboot-mf-0.1.0-TEST61-ram.fip payloads/mf/recovery/

      - name: Build MF persistent runtime BL33
        env:
          MF2_MEDVE_DIR: ${{ github.workspace }}/work/medveflasher-rc35
          JOBS: '2'
        run: |
          bash ursusboot/scripts/build_mf_runtime.sh
          mkdir -p payloads/mf/ursusboot
          cp work/mf-runtime/out/u-boot.runtime.lzma payloads/mf/ursusboot/u-boot.runtime.lzma
          grep -Fxq 'bootcmd=ursusdispatch' work/mf-runtime/out/MF_RUNTIME.env
          grep -q '^CONFIG_ENV_IS_IN_UBI=y$' work/mf-runtime/out/u-boot.MF_RUNTIME.full.config
          ! grep -q '^CONFIG_ENV_IS_NOWHERE=y$' work/mf-runtime/out/u-boot.MF_RUNTIME.full.config
          echo MF_RUNTIME_BUILD=PASS

      - name: Stage only required Medve hardware primitives
        run: |
          set -e
          MEDVE=work/medveflasher-rc35/data
          SRC="$MEDVE/payloads"

          mkdir -p payloads/mf/proven
          cp "$SRC/nokia-xg-040g-mf-an7583-production-preloader.bin" payloads/mf/proven/
          test "$(stat -c %s payloads/mf/proven/nokia-xg-040g-mf-an7583-production-preloader.bin)" = 118333
          test "$(sha256sum payloads/mf/proven/nokia-xg-040g-mf-an7583-production-preloader.bin | awk '{print $1}')" = 778d10a65276085b70bec005248fc87ec208b43b0239502f15ade20fe528301e

          cp "$MEDVE/backup-agent.sh" ursusflasher/src/backup-agent.sh
          rm -rf ursusflasher/src/diagnostics ursusflasher/src/recovery ursusflasher/src/vendor
          cp -a "$MEDVE/diagnostics" ursusflasher/src/diagnostics
          mkdir -p ursusflasher/src/recovery/recovery-clients-bin ursusflasher/src/recovery/mf
          cp "$MEDVE/recovery/recovery-clients-bin/nokia-tftp" ursusflasher/src/recovery/recovery-clients-bin/
          cp "$MEDVE/recovery/recovery-clients-bin/nokia-scp" ursusflasher/src/recovery/recovery-clients-bin/

          cp "$SRC/nokia-xg-040g-mf-an7583-uart-preloader.bin" \
            ursusflasher/src/recovery/mf/openwrt-airoha-an7583-airoha_an7583-evb-preloader.bin
          cp "$SRC/nokia-xg-040g-mf-an7583-uart-recovery-safe-bl31-uboot.fip" \
            ursusflasher/src/recovery/mf/openwrt-airoha-an7583-airoha_an7583-evb-bl31-uboot.fip
          cp "$SRC/nokia-xg-040g-mf-an7583-stock-recovery-initramfs.itb" \
            ursusflasher/src/recovery/mf/nokia-xg040gmf-stock-recovery-initramfs.itb
          cat > ursusflasher/src/recovery/mf/OPENWRT_SNAPSHOT.json <<'JSON'
          {
            "target": "airoha/an7583",
            "source": "https://downloads.openwrt.org/snapshots/targets/airoha/an7583/",
            "artifacts": {
              "preloader": {
                "file": "openwrt-airoha-an7583-airoha_an7583-evb-preloader.bin",
                "size": 118322,
                "sha256": "c2ac1c183b18bc34632c958dfe0bd1dfdfb607f090e39c41126956641893362f"
              },
              "fip": {
                "file": "openwrt-airoha-an7583-airoha_an7583-evb-bl31-uboot.fip",
                "size": 339010,
                "sha256": "8bfe8870e44923a463a3ed66c8b1906214f5c820fd8c15865c63430185de8bb2"
              }
            }
          }
          JSON

          cp payloads/md/ursusboot/openwrt-airoha-an7581-nokia_xg-040g-md-ubi-preloader.bin \
            ursusflasher/src/recovery/openwrt-airoha-an7581-nokia_xg-040g-md-ubi-preloader.bin
          cp payloads/md/bootrom-backup/openwrt-airoha-an7581-nokia_xg-040g-md-ubi-bl31-uboot-ethfix.fip \
            ursusflasher/src/recovery/openwrt-airoha-an7581-nokia_xg-040g-md-ubi-bl31-uboot-ethfix.fip
          cp payloads/md/bootrom-backup/nokia-xg040gmd-stock-recovery-initramfs.itb \
            ursusflasher/src/recovery/nokia-xg040gmd-stock-recovery-initramfs.itb

          test ! -e ursusflasher/src/vendor
          test ! -e ursusflasher/src/transition-bundle.bin
          test ! -e ursusflasher/src/mf-transition-bundle.bin
          test ! -e ursusflasher/src/stock-launcher.sh.in
          test ! -e ursusflasher/src/env_patcher.py
          test ! -e ursusflasher/src/recovery/transition-control-source
          test ! -e ursusflasher/src/recovery/transition-network-source
          test ! -e ursusflasher/src/recovery/recovery-safe-uboot-source
          echo MEDVE_RUNTIME_PRIMITIVES_ONLY=PASS

      - name: Stamp 0.2.62 package metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          assert version == '0.2.62'
          build_tag = 'ursusflasher-0.2.62-md-mf-test61-minimal'

          backend = Path('ursusflasher/src/proven_backend.py')
          text = backend.read_text(encoding='utf-8')
          old_version = 'APP_VERSION = "0.1.0-md-lab1"'
          old_tag = 'BUILD_TAG = "ursusflasher-0.1.0-md-lab1-proven-port"'
          assert text.count(old_version) == 1
          assert text.count(old_tag) == 1
          text = text.replace(old_version, f'APP_VERSION = "{version}"')
          text = text.replace(old_tag, f'BUILD_TAG = "{build_tag}"')
          backend.write_text(text, encoding='utf-8', newline='\n')

          mf = Path('ursusflasher/src/mf_runtime_install.py')
          text = mf.read_text(encoding='utf-8')
          old = 'access = _open_stock_access_auto(host) if unattended else pb.ask_credentials(require_model_gate=True, offer_interactive_plain_retry=True)'
          new = 'access = _open_stock_access_auto(host)'
          assert text.count(old) == 1
          mf.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          manifest_path = Path('config/MANIFEST.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for key in ('bundle', 'manual_bundle', 'mf_transition_bundle', 'mf_manual_transition_bundle', 'transition_metadata_provenance'):
              manifest.pop(key, None)
          manifest['version'] = version
          manifest['build_tag'] = build_tag
          release = manifest.setdefault('release', {})
          release['version'] = version
          release['build_tag'] = build_tag
          release['archive_root'] = f'UrsusFlasher-{version}'
          manifest['runtime_lineage'] = {
              'md': 'UrsusBoot TEST61 frozen + repository recovery primitives',
              'mf': 'UrsusBoot TEST61 runtime + MedveFlasher hardware-proven recovery/BL2 primitives @ 342cac4cb99a924f3d83eb8e4b5259490377704e',
              'legacy_transition_installer': False,
          }
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          caps_path = Path('config/FIRMWARE_CAPABILITIES.json')
          caps = json.loads(caps_path.read_text(encoding='utf-8'))
          caps['version'] = version
          caps_path.write_text(json.dumps(caps, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('MINIMAL_METADATA=PASS')
          PY

      - name: Static host QA and runtime dependency verification
        env:
          NOKIA_LANG: en
        run: |
          python3 -m py_compile ursusflasher/src/*.py ursusflasher/src/diagnostics/*.py
          python3 ursusflasher/src/stock_web.py --selftest
          cp config/*.json ursusflasher/src/
          cp VERSION ursusflasher/src/VERSION
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path('.').resolve()
          sys.path.insert(0, str(root/'ursusflasher/src'))
          import board_profiles as bp
          import expert_multi
          import mf_runtime_install
          import one_key_multi
          import proven_backend as pb
          import runtime_kit
          import stock_bootarea_restore as sbr
          import uart_bootarea_restore as ur

          assert set(json.loads((root/'config/FIRMWARE_BUNDLES.json').read_text())['profiles']) == {'md', 'mf'}
          for fam in ('md', 'mf'):
              p = bp.load_profiles()[fam]
              assert p['model'].endswith('-' + fam.upper())
              one_key_multi.verify_family_payloads(fam)
              ur.verify_profile(ur.family_profile(fam))
              assert sbr.bundled_stock_mtd0(fam) is not None
          assert mf_runtime_install.require_bl33().name == 'u-boot.runtime.lzma'
          runtime_kit.verify_kit()
          assert pb.verify_kit is runtime_kit.verify_kit
          print('RUNTIME_MINIMAL_QA=PASS')
          PY
          rm ursusflasher/src/BOARD_PROFILES.json ursusflasher/src/FIRMWARE_BUNDLE.json ursusflasher/src/FIRMWARE_BUNDLES.json ursusflasher/src/FIRMWARE_CAPABILITIES.json ursusflasher/src/MANIFEST.json ursusflasher/src/UI_TERMS.json ursusflasher/src/VERSION

      - name: Build minimal 0.2.62 release tree
        run: python3 scripts/build_release.py --out-dir dist

      - name: Audit final minimal ZIP
        run: |
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          zpath = Path('dist/UrsusFlasher-0.2.62.zip')
          assert zpath.is_file(), zpath
          r = 'UrsusFlasher-0.2.62/'
          fw_expected = {
              'openwrt-airoha-an7581-nokia_xg-040g-md-initramfs-uImage.itb': (8335560, '6696c96ef824defc56163f9fe4f2846fd4ab61cdbc5679415939d658071dca63'),
              'openwrt-airoha-an7581-nokia_xg-040g-md-squashfs-sysupgrade.bin': (8714513, '23ad06174184f71c9a845734571752f62930ba1cfac45f4ad8deadd9d8965820'),
              'openwrt-airoha-an7581-nokia_xg-040g-md-ubi-initramfs-recovery.itb': (8519680, '3ce8726e38f6dcdbdb6f25859e269ad32fe04201c5b57b064b11da7e469864fb'),
              'openwrt-airoha-an7581-nokia_xg-040g-md-ubi-squashfs-sysupgrade.itb': (10408217, '47ea7c6f1e22a4aae9482e653a4fc6e87524f7e27847aaaed7fb75349cae7f3d'),
              'openwrt-airoha-an7583-nokia_xg-040g-mf-initramfs-uImage.itb': (8180272, '92ad187fc271cce7e3a6e4556679f4307ceefdfc9db1ca2c34269d9ee3eba326'),
              'openwrt-airoha-an7583-nokia_xg-040g-mf-squashfs-sysupgrade.bin': (8540433, 'bd2a4947468ddd7ca71a42d36c7fd4462a24a1ceb6be4658f79c5c2bcb0ccf29'),
              'openwrt-airoha-an7583-nokia_xg-040g-mf-ubi-initramfs-recovery.itb': (8257536, '2d00595c7aab49d8f24de0d13374c6c3b479b846267dd3644fbb305db071f05c'),
              'openwrt-airoha-an7583-nokia_xg-040g-mf-ubi-squashfs-sysupgrade.itb': (10240281, '0043b450c1d8e311b6f6c12458c66e976a72cb93ed657e12029fa79fffe5dc3a'),
          }
          payload_expected = {
              'data/payloads/md/ursusboot/openwrt-6.18.44-mtd-rw.ko',
              'data/payloads/md/ursusboot/openwrt-airoha-an7581-nokia_xg-040g-md-ubi-preloader.bin',
              'data/payloads/md/stock/nokia-xg-040g-md-stock-mtd0.bin',
              'data/payloads/md/ursusboot/ursus-mtd-raw',
              'data/payloads/md/ursusboot/ursusboot-md-0.1.0-alpha3-bl2.bin',
              'data/payloads/md/ursusboot/ursusboot-md-0.1.0-alpha3-ram-installer.fip',
              'data/payloads/md/ursusboot/ursusboot-md-0.1.0-alpha3-update.fip',
              'data/payloads/md/ursusboot/ursusboot-md-0.1.0-alpha5-UBIUX1-TEST61-update.fip',
              'data/payloads/mf/stock/nokia-xg-040g-mf-stock-mtd0.bin',
              'data/payloads/mf/ursusboot/u-boot.runtime.lzma',
              'data/payloads/mf/recovery/ursusboot-mf-0.1.0-TEST61-uart-preloader.bin',
              'data/payloads/mf/recovery/ursusboot-mf-0.1.0-TEST61-ram.fip',
              'data/payloads/mf/proven/nokia-xg-040g-mf-an7583-production-preloader.bin',
          }
          stock_expected = {
              'data/payloads/md/stock/nokia-xg-040g-md-stock-mtd0.bin': (524288, 'c98f268db69fb3d8ab3ba7bd11f9aa0cc3bfbaacf5b952e7a4e25094476bb629'),
              'data/payloads/mf/stock/nokia-xg-040g-mf-stock-mtd0.bin': (524288, '144d63272049eeb7122a01f2f3a0192b874ca4c68c10a5b4726fa4c2e84ac1bf'),
          }
          forbidden = (
              'transition-bundle.bin', 'transition-manual-bundle.bin',
              'mf-transition-bundle.bin', 'mf-transition-manual-bundle.bin',
              'stock-launcher.sh.in', 'env_patcher.py', 'vendor/',
              'manual-transition-source/', 'transition-control-source/',
              'transition-network-source/', 'recovery-clients-source/',
              'recovery-safe-uboot-source/', 'alpha4_hwfix_test.py',
              'expert_mf_acceptance.py', 'mf_persistent_install.py',
              'stock_mtd0_reference.bin',
          )
          with zipfile.ZipFile(zpath) as z:
              names = [n for n in z.namelist() if not n.endswith('/')]
              assert {n.split('/', 1)[0] for n in names} == {'UrsusFlasher-0.2.62'}
              rel = {n[len(r):] for n in names if n.startswith(r)}
              assert not [n for n in rel if any(token in n for token in forbidden)]
              fw_actual = {n[len('fw/'):] for n in rel if n.startswith('fw/') and n != 'fw/README.md'}
              assert fw_actual == set(fw_expected), (sorted(fw_actual), sorted(fw_expected))
              for name, (size, sha) in fw_expected.items():
                  blob = z.read(r+'fw/'+name)
                  assert len(blob) == size
                  assert hashlib.sha256(blob).hexdigest() == sha
              payload_actual = {n for n in rel if n.startswith('data/payloads/')}
              assert payload_actual == payload_expected, (sorted(payload_actual), sorted(payload_expected))
              for name, (size, sha) in stock_expected.items():
                  blob = z.read(r+name)
                  assert len(blob) == size, name
                  assert hashlib.sha256(blob).hexdigest() == sha, name
              docs = {n for n in rel if n.startswith('doc/')}
              assert not any('TEST57' in n or 'TEST58' in n or 'TEST59' in n or 'TEST60' in n for n in docs)
              assert r+'data/runtime_kit.py' in names
              assert r+'data/recovery/recovery-clients-bin/nokia-tftp' in names
              assert r+'data/recovery/recovery-clients-bin/nokia-scp' in names
          print('FINAL_MINIMAL_ZIP_AUDIT=PASS', zpath, zpath.stat().st_size)
          PY

      - name: Stage package artifact
        run: |
          mkdir -p upload
          cp dist/UrsusFlasher-0.2.62.zip upload/
          cp dist/UrsusFlasher-0.2.62.zip.sha256.txt upload/
          sha256sum upload/UrsusFlasher-0.2.62.zip > upload/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ursusflasher-0.2.62-md-mf-minimal-hwtest
          path: upload/
          if-no-files-found: error
