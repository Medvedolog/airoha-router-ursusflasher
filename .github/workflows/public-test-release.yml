name: Public test release - Nokia XG-040G-MD + MF

# The only workflow that publishes a release. It does not rebuild anything: it
# publishes the ZIP that "MD+MF direct item4 test kit" already built and
# verified (verify_kit) for this exact commit, after the operator confirms the
# hardware test. The full repository kit is not published.

on:
  workflow_dispatch:
    inputs:
      kit_run_id:
        description: 'Successful "MD+MF direct item4 test kit" run for this exact commit'
        required: true
        type: string
      hardware_passed:
        description: "TEST64 hardware acceptance passed on MD and MF (docs/TEST64_TEST_RU.md)"
        required: true
        type: boolean
        default: false
      tag:
        description: "Test tag. Leave empty for test-v<RELEASE>-run<RUN_NUMBER>"
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: public-test-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require hardware acceptance
        if: ${{ !inputs.hardware_passed }}
        run: |
          echo "Publish only after the TEST64 hardware acceptance passed on MD and MF (docs/TEST64_TEST_RU.md)." >&2
          exit 2

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch the verified kit built for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          KIT_RUN: ${{ inputs.kit_run_id }}
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$KIT_RUN")"
          test "$(jq -r .path <<<"$RUN")" = ".github/workflows/md-item4-direct-ubi.yml"
          test "$(jq -r .conclusion <<<"$RUN")" = success
          test "$(jq -r .head_sha <<<"$RUN")" = "$GITHUB_SHA" || { echo "kit run $KIT_RUN is for $(jq -r .head_sha <<<"$RUN"), not $GITHUB_SHA" >&2; exit 3; }
          gh run download "$KIT_RUN" -R "$GITHUB_REPOSITORY" -p "UrsusFlasher-MD-MF-*-$GITHUB_SHA" -D kit-artifact
          mkdir -p dist-public
          find kit-artifact -type f -exec mv -t dist-public {} +
          ls -la dist-public
          cat dist-public/URSUSFLASHER_COMMIT.txt
          grep -Fxq "URSUSFLASHER_COMMIT=$GITHUB_SHA" dist-public/URSUSFLASHER_COMMIT.txt
          ZIP="$(find dist-public -maxdepth 1 -name '*.zip' -print -quit)"
          grep -Fxq "ZIP_SHA256=$(sha256sum "$ZIP" | cut -d' ' -f1)" dist-public/URSUSFLASHER_COMMIT.txt

      - name: Verify public package boundary and checksums
        run: python3 scripts/verify_public_release.py dist-public

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # VERSION is the full build identity. Everything a person reads — the
          # archive, the folder it unpacks to, the tag, the title — uses only the
          # release number in front of the first dash.
          VERSION="$(tr -d '\r\n' < VERSION)"
          RELEASE="${VERSION%%-*}"
          if [ -n "${REQUESTED_TAG:-}" ]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="test-v${RELEASE}-run${GITHUB_RUN_NUMBER}"
          fi
          case "$TAG" in
            test-*) ;;
            *) echo "Public test-release tag must start with test-" >&2; exit 2 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=UrsusFlasher-${RELEASE}-PUBLIC-TEST.zip" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 3
          fi

      - name: Prepare release notes
        shell: bash
        env:
          RELEASE: ${{ steps.meta.outputs.release }}
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -euo pipefail
          DIGEST="$(awk '{print $1; exit}' "dist-public/${ASSET}.sha256.txt")"
          cat > dist-public/RELEASE_NOTES_RU.md <<EOF
          # UrsusFlasher ${RELEASE} — Nokia XG-040G-MD и XG-040G-MF

          Установка OpenWrt на Nokia XG-040G-MD (AN7581) и XG-040G-MF (AN7583). Нужен Python 3.12+ и кабель Ethernet; сторонние Python-пакеты не требуются.

          ## Сначала сбросьте Nokia на заводские настройки

          **Это обязательно перед каждой итерацией** — и перед первой установкой, и перед
          любым повтором после неудачи. Сброс делается на стоковой прошивке: зажать Reset,
          держать **не меньше 20 секунд**, отпустить и дождаться перезагрузки.

          Иначе состояние стоковой системы неизвестно: остаются изменённые настройки,
          включённые или выключенные службы и следы прошлых попыток, из-за которых
          определение устройства и доступ могут повести себя не так, как ожидается.

          ## С чего начать

          Распакуйте архив и запустите из папки:

          | | Windows | Linux / macOS |
          |---|---|---|
          | **Обычная установка** | \`START_ONECLICK.cmd\` | \`./START_ONECLICK.sh\` |
          | **Ручной режим** | \`START_EXPERT.cmd\` | \`./START_EXPERT.sh\` |

          Если вы просто хотите поставить OpenWrt — запускайте **ONE-CLICK**. Он сам определит,
          в каком состоянии роутер (заводская Nokia, уже установленная OpenWrt или режим
          восстановления), и выберет способ подключения.

          **Подключайтесь в LAN2 или LAN3.** LAN1 идёт через отдельный чип и для перепрошивки
          не годится, а LAN4 после загрузки OpenWrt становится WAN — и \`192.168.1.1\` по нему пропадёт.

          ## Ручной режим: что когда запускать

          \`START_EXPERT\` открывает меню. Пункты со знаком \`!\` пишут во flash-память.

          | Пункт | Когда нужен |
          |---|---|
          | \`1\` Установить OpenWrt | маршрут ONE-CLICK; на Nokia STOCK EXPERT может явно пропустить полный backup только для этого запуска; один \`[y/N]\` остаётся перед direct \`mtd0\` write |
          | \`2\` Установить или обновить UrsusBoot | обновить загрузчик на уже работающем роутере |
          | \`3\` Записать свою прошивку OpenWrt | поставить собственный образ вместо комплектного |
          | \`4\` Stock Nokia → OpenWrt UBI → Vanilla U-Boot | MD и MF: UrsusBoot TEST64 + быстрый BL2 → OpenWrt на UBI → закреплённый Vanilla U-Boot |
          | \`5\` Восстановить загрузчик | роутер не включается; нужен USB-UART 3,3 В |
          | \`7\` Создать полную копию flash | снять резервную копию до любых записей |
          | \`8\` Проверить резервную копию | убедиться, что копия пригодна для восстановления |
          | \`10\` Состояние устройства | посмотреть, что за роутер и что с ним сейчас можно |
          | \`11\` Flash-память и разметка | разделы и сбойные блоки, только чтение |
          | \`12\` Проверить файлы комплекта | сверить сам архив перед работой |

          Пункты \`6\` и \`9\` в этой сборке ещё не реализованы.

          ## Перед первой записью

          В обычном ONE-CLICK полный stock backup создаётся и проверяется автоматически. В EXPERT
          пункте 1 его можно явно пропустить только для текущего тестового запуска; live \`mtd0\` capture
          остаётся обязательным, а перед direct \`mtd0\` write задаётся один \`[y/N]\`. Не выключайте
          питание во время записи. Для аварийного восстановления понадобится USB-UART 3,3 В:
          подключаются TX, RX и GND, **VCC не подключается**.

          Подробности — в приложенных \`INSTRUCTIONS_RU.md\` и \`EMERGENCY_URSUSBOOT_RU.md\`.

          > **UrsusBoot TEST64** из \`Medvedolog/airoha-ursusboot\` на закреплённом коммите, MD и MF,
          > с быстрым UBI BL2. Хэши preloader и BL2 — в \`PUBLIC_TEST_RELEASE.txt\` внутри архива.
          > Аппаратная приёмка MD и MF пройдена (\`TEST64_TEST_RU.md\`).

          ## Проверка архива

          \`\`\`text
          ${DIGEST}
          \`\`\`

          Сборка: \`${VERSION}\`
          EOF

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE: ${{ steps.meta.outputs.release }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "UrsusFlasher ${RELEASE} — публичный тест" \
            --prerelease \
            --notes-file dist-public/RELEASE_NOTES_RU.md \
            "dist-public/${ASSET}" \
            "dist-public/${ASSET}.sha256.txt" \
            "docs/INSTRUCTIONS_RU.md" \
            "docs/EMERGENCY_URSUSBOOT_RU.md" \
            "docs/CHANGELOG_RU.md" \\
            "docs/TEST64_TEST_RU.md"
