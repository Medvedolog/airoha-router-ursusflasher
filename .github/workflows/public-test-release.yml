name: Public test release - Nokia XG-040G-MD

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Test tag. Leave empty for test-v<VERSION>-run<RUN_NUMBER>"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: public-test-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify repository and boot-chain artifacts
        run: |
          python3 scripts/verify_boot_chain.py
          python3 scripts/verify_repo.py

      - name: Build public MD test package
        run: python3 scripts/build_public_release.py --out-dir dist-public

      - name: Verify public package boundary and checksums
        run: python3 scripts/verify_public_release.py dist-public

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [ -n "${REQUESTED_TAG:-}" ]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="test-v${VERSION}-run${GITHUB_RUN_NUMBER}"
          fi
          case "$TAG" in
            test-*) ;;
            *) echo "Public test-release tag must start with test-" >&2; exit 2 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=UrsusFlasher-${VERSION}-PUBLIC-TEST.zip" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 3
          fi

      - name: Prepare release notes
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cat > dist-public/RELEASE_NOTES_RU.md <<EOF
          # UrsusFlasher TEST ${VERSION}

          **Публичная тестовая сборка для Nokia XG-040G-MD.**

          Готовый комплект для запуска флешера и прошивки: необходимые boot/recovery payload, два OpenWrt sysupgrade-образа и пользовательская документация. SDK, toolchain/GCC, дерево исходников OpenWrt, внутренние инженерные документы, QA-архивы и self-test tools в asset не включаются.

          Для прошивки рекомендуется использовать **LAN2 или LAN3**. LAN1 работает через отдельный PHY EN8811H; LAN4 в комплектной OpenWrt-сборке после загрузки назначается WAN.

          **FUDAN1 остаётся HW_TEST_REQUIRED до отдельного аппаратного acceptance-прогона.**

          Перед использованием сверяйте SHA256 прикреплённого ZIP.
          EOF

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "UrsusFlasher TEST ${VERSION}" \
            --prerelease \
            --notes-file dist-public/RELEASE_NOTES_RU.md \
            "dist-public/${ASSET}" \
            "dist-public/${ASSET}.sha256.txt" \
            "docs/INSTRUCTIONS_RU.md" \
            "docs/EMERGENCY_URSUSBOOT_RU.md" \
            "docs/CHANGELOG_RU.md"
