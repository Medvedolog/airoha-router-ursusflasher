name: build-ursusflasher-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag; empty = v<VERSION>"
        required: false
        default: ""
      prerelease:
        description: "Mark GitHub Release as prerelease"
        required: true
        type: boolean
        default: true
      make_latest:
        description: "Promote this release to Latest (clears the prerelease flag)"
        required: false
        type: boolean
        default: false
      retag:
        description: "Move an existing tag to the commit being built (rebuild of the same version)"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ursusflasher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve and validate release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python .github/ci/check_release_identity.py . | tail -n1)"
          ROOT="UrsusFlasher-${VERSION}"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v${VERSION}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=$VERSION ROOT=$ROOT TAG=$TAG"

      - name: Verify repository tree against SHA256SUMS
        run: |
          sha256sum -c SHA256SUMS
          python .github/ci/check_sums_coverage.py .

      - name: Verify pinned tcboot and sysupgrade payloads
        run: python .github/ci/check_pinned_payloads.py .

      - name: Static validation and offline selftests
        shell: bash
        run: |
          set -euo pipefail
          find data tools -type f -name '*.py' -print0 | xargs -0 -n1 python -m py_compile
          find . -type f -name '*.sh' -not -path './.git/*' -print0 |
            while IFS= read -r -d '' f; do sh -n "$f"; done
          find data -type f -name '*.json' -print0 |
            while IFS= read -r -d '' f; do python -m json.tool "$f" >/dev/null; done

          python data/stock_web.py --selftest
          python tools/selftest.py
          python data/payloads/md/tcboot/verify_patch.py

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Build offline flasher ZIP
        id: package
        env:
          RELEASE_ROOT: ${{ steps.identity.outputs.release_root }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ursusflasher-release"
          STAGE="$OUT/$RELEASE_ROOT"
          rm -rf "$OUT"
          mkdir -p "$STAGE/work"

          cp README.md LICENSE VERSION SHA256SUMS START.cmd START.sh "$STAGE/"
          cp -a data doc fw tools "$STAGE/"
          find "$STAGE" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$STAGE" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          find "$STAGE" -type d -exec chmod 0755 {} +
          find "$STAGE" -type f -exec chmod 0644 {} +
          chmod 0755 "$STAGE/START.sh"

          # The staged kit must satisfy its own manifest before it is sealed;
          # a ZIP that fails this on a tester's disk has already been downloaded.
          (cd "$STAGE" && sha256sum -c SHA256SUMS)
          python .github/ci/check_sums_coverage.py "$STAGE"

          ZIP="$OUT/${RELEASE_ROOT}.zip"
          python .github/ci/pack_release.py "$OUT" "$RELEASE_ROOT" "$ZIP"

          SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA" "$(basename "$ZIP")" > "${ZIP}.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha_file=${ZIP}.sha256" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ZIP SHA256: $SHA"

      - name: Blind re-extract and verify the built ZIP
        env:
          ZIP: ${{ steps.package.outputs.zip }}
          RELEASE_ROOT: ${{ steps.identity.outputs.release_root }}
        shell: bash
        run: |
          set -euo pipefail
          VERIFY="$RUNNER_TEMP/ursusflasher-blind-verify"
          rm -rf "$VERIFY"
          mkdir -p "$VERIFY"
          unzip -q "$ZIP" -d "$VERIFY"

          mapfile -t TOP < <(find "$VERIFY" -mindepth 1 -maxdepth 1 -print | sort)
          if [ "${#TOP[@]}" -ne 1 ] || [ "$(basename "${TOP[0]}")" != "$RELEASE_ROOT" ]; then
            echo "ERROR: built ZIP does not unpack to exactly one expected root"
            printf '  %s\n' "${TOP[@]:-<none>}"
            exit 1
          fi
          ROOT="${TOP[0]}"

          (cd "$ROOT" && sha256sum -c SHA256SUMS)
          python .github/ci/check_sums_coverage.py "$ROOT"
          python .github/ci/check_release_identity.py "$ROOT" >/dev/null
          python .github/ci/check_pinned_payloads.py "$ROOT"

          if find "$ROOT" \( -type d -name __pycache__ -o -type f -name '*.pyc' -o -type f -name '*.pyo' \) -print -quit | grep -q .; then
            echo "ERROR: cache/bytecode leaked into the release ZIP"
            exit 1
          fi
          if [ -n "$(find "$ROOT/work" -mindepth 1 -print -quit)" ]; then
            echo "ERROR: work/ is not empty in the release ZIP"
            exit 1
          fi

          # The archive is what a tester actually runs, so the selftest runs there.
          (cd "$ROOT" && python tools/selftest.py)
          find "$ROOT" -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrsusFlasher-${{ steps.identity.outputs.version }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release notes
        id: notes
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_ROOT: ${{ steps.identity.outputs.release_root }}
          ZIP_SHA: ${{ steps.package.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/ursusflasher-release-notes.md"
          cat > "$NOTES" <<EOF
          # 🐻 UrsusFlasher ${VERSION}

          Offline OpenWrt install and recovery kit for **Nokia XG-040G-MD / Airoha AN7581**.
          tcboot is installed into \`mtd0\` as a permanent recovery loader; OpenWrt is
          installed and reinstalled from its WebFailsafe page. No UART, no soldering.

          ## For testers

          1. Download \`${RELEASE_ROOT}.zip\` and verify it against \`${RELEASE_ROOT}.zip.sha256\`.
          2. Unpack. Run \`START.cmd\` on Windows or \`./START.sh\` on Linux — Python 3 is the only requirement.
          3. Read \`doc/INSTRUCTIONS_RU.md\` (or \`doc/INSTRUCTIONS_EN.md\`) before the first destructive step.

          The hardware-verified way into tcboot WebFailsafe is **power OFF → power ON →
          immediately press Reset → hold 10 seconds → release**. Holding Reset *before*
          applying power is the early BootROM \`Press x\` path instead, and will not get
          you there.

          ## What is in the archive

          \`${RELEASE_ROOT}.zip\` unpacks to a single directory:

          | | |
          |---|---|
          | \`START.cmd\` / \`START.sh\` | entry points (Windows / Linux) |
          | \`data/\` | wizard, backend, FIT/FDT preflight, tcboot builder, tcboot payloads |
          | \`fw/\` | bundled OpenWrt UBI sysupgrade \`.itb\` |
          | \`doc/\` | instructions, architecture, changelog, patch history (RU / EN) |
          | \`tools/selftest.py\` | offline selftest, runnable without a router |
          | \`work/\` | empty working directory for session logs and backups |
          | \`SHA256SUMS\` | manifest covering every shipped file |

          CI workflows and their helper scripts are repository-side and are not shipped.

          ## Verified on real hardware

          - personalized tcboot written to \`mtd0\`, full \`0x80000\` readback, byte-for-byte compare;
          - WebFailsafe reachable, official OpenWrt UBI sysupgrade uploaded over HTTP/1.0 multipart;
          - full FIT write and readback, runtime FDT fixup of the UBI region to \`0x00100000 0x0ff00000\`;
          - Linux 6.18.44, UBI attach, UBIFS \`rootfs_data\`, overlay, \`procd\`;
          - a **second** sysupgrade through tcboot Web afterwards — tcboot and its environment
            live outside the UBI region and are not erased by it.

          ## Known limitations

          - The tcboot Web sysupgrade is a **recovery-style reinstall**: \`fit\` and \`rootfs_data\`
            are removed and recreated. It does not preserve OpenWrt configuration.
          - **Nokia XG-040G-MF / AN7583 is not exposed by this build** (\`NOT_EXPOSED_BY_MD_LAB1\`).
          - UART stock restore exists in the ported backend but is not wired into this UI.

          ## Integrity

          **Archive:** \`${RELEASE_ROOT}.zip\`
          **SHA256:** \`${ZIP_SHA}\`

          Built from the repository tree after \`sha256sum -c SHA256SUMS\`, exact manifest
          coverage, pinned tcboot/sysupgrade digests, the offline selftest and a
          deterministic patch8 tcboot rebuild. The packed archive is then re-extracted
          blind and put through the same checks plus the selftest again.
          EOF
          echo "file=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
          SHA_FILE: ${{ steps.package.outputs.sha_file }}
          NOTES: ${{ steps.notes.outputs.file }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
          MAKE_LATEST_INPUT: ${{ inputs.make_latest }}
          RETAG_INPUT: ${{ inputs.retag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its assets."
            # Replacing the assets without moving the tag would leave the published
            # ZIP built from a tree the tag does not point at. Rebuilding the same
            # version is only honest if the tag follows the commit.
            if [ "${RETAG_INPUT:-false}" = "true" ]; then
              TAGGED="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
              if [ "$TAGGED" != "$GITHUB_SHA" ]; then
                echo "Moving $TAG from $TAGGED to $GITHUB_SHA."
                gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
                  -f sha="$GITHUB_SHA" -F force=true >/dev/null
              else
                echo "$TAG already points at $GITHUB_SHA."
              fi
            fi
            gh release upload "$TAG" "$ZIP" "$SHA_FILE" --clobber
            # The notes carry the archive SHA256. Replacing the asset without
            # refreshing them publishes a checksum that no longer matches the
            # download, so a tester verifying the ZIP concludes it is corrupt.
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            args=(release create "$TAG" "$ZIP" "$SHA_FILE" --target "$GITHUB_SHA" --title "UrsusFlasher ${VERSION}" --notes-file "$NOTES")
            if [ "${PRERELEASE_INPUT:-true}" = "true" ] || [[ "$VERSION" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi

          # GitHub refuses to mark a prerelease as Latest, so promoting one has to
          # clear that flag in the same edit.
          if [ "${MAKE_LATEST_INPUT:-false}" = "true" ]; then
            gh release edit "$TAG" --prerelease=false --latest
            echo "Promoted $TAG to Latest."
          fi
