name: MD TRANSITION2 NETDBG1 build

on:
  push:
    branches:
      - feature/ursusboot-modular-airoha
    paths:
      - '.github/workflows/md-transition1-build.yml'
      - 'ursusboot/scripts/build_md_transition1.sh'
      - 'ursusboot/patches/190-md-transition1-handoff.patch'
      - 'ursusboot/patches/200-transition2-uart-fallback.patch'
      - 'ursusboot/patches/210-transition2-netdbg1-netreset.patch'
      - 'ursusboot/configs/ursusboot-transition-handoff.cfg'
      - 'ursusboot/source/ursusboot-0.1.0-alpha5-UBIUX1-TEST61-source.tar.zst'
      - 'toolchains/**'
      - 'ursusflasher/src/**'
      - 'ursusflasher/tools/repack_xg140_native_fip.py'
      - 'START_EXPERT.cmd'
      - 'START_EXPERT.sh'
      - 'START_ONECLICK.cmd'
      - 'START_ONECLICK.sh'
      - 'scripts/repo_common.py'
      - 'scripts/build_transition_test_rollup.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build MD TRANSITION2 NETDBG1 stock Linux handoff
        run: bash ursusboot/scripts/build_md_transition1.sh
      - name: Upload TRANSITION2 NETDBG1 engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: ursusboot-md-transition2-netdbg1-stockfit-${{ github.sha }}
          path: work/md-transition2/out/
          if-no-files-found: error
          retention-days: 14
      - name: Download audited 0.2.62 full hardware kit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audited-base
          gh run download 34589613011 \
            --repo "$GITHUB_REPOSITORY" \
            --name ursusflasher-0.2.62-md-mf-minimal-hwtest \
            --dir audited-base
          test -f audited-base/UrsusFlasher-0.2.62.zip
      - name: Build full UrsusFlasher TRANSITION2 NETDBG1 test rollup
        run: |
          python3 scripts/build_transition_test_rollup.py \
            --linux-image work/md-transition2/out/ursusboot-md-0.1.0-alpha5-UBIUX1-TRANSITION2.linuximg \
            --base-zip audited-base/UrsusFlasher-0.2.62.zip \
            --base-run-id 34589613011 \
            --out-dir dist-transition \
            --source-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}"
      - name: Smoke-test packaged EXPERT import closure
        run: |
          rm -rf smoke-root
          mkdir smoke-root
          unzip -q dist-transition/UrsusFlasher-0.2.63-MD-AB-TRANSITION2-NETDBG1-PUBLIC-TEST.zip -d smoke-root
          ROOT_DIR="$(find smoke-root -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$ROOT_DIR"
          test -f "$ROOT_DIR/START_EXPERT.cmd"
          test -f "$ROOT_DIR/START_ONECLICK.cmd"
          test ! -e "$ROOT_DIR/START_MD_TRANSITION.cmd"
          test ! -e "$ROOT_DIR/START_UART_RESTORE.cmd"
          PYTHONPATH="$ROOT_DIR/data" python3 -c 'import expert, one_key, bootloader_install_menu, xg140_profile; print("PACKED_RUNTIME_IMPORT_SMOKE=PASS")'
      - name: Upload full UrsusFlasher TRANSITION2 NETDBG1 test rollup
        uses: actions/upload-artifact@v4
        with:
          name: ursusflasher-md-ab-transition2-netdbg1-public-test-${{ github.sha }}
          path: dist-transition/
          if-no-files-found: error
          retention-days: 14
