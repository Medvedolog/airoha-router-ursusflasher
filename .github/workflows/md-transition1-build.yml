name: MD TRANSITION1 build

on:
  push:
    branches:
      - feature/mf3-an7583-persistent
    paths:
      - '.github/workflows/md-transition1-build.yml'
      - 'ursusboot/scripts/build_md_transition1.sh'
      - 'ursusboot/patches/190-md-transition1-handoff.patch'
      - 'ursusboot/configs/ursusboot-transition-handoff.cfg'
      - 'ursusboot/source/ursusboot-0.1.0-alpha5-UBIUX1-TEST61-source.tar.zst'
      - 'toolchains/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build MD TRANSITION1
        run: bash ursusboot/scripts/build_md_transition1.sh
      - name: Upload engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: ursusboot-md-transition1-${{ github.sha }}
          path: work/md-transition1/out/
          if-no-files-found: error
          retention-days: 14
