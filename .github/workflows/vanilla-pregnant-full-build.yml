name: Vanilla pregnant MD+MF build
# Legacy: manual only. Superseded by md-item4-direct-ubi.yml (the canonical MD+MF
# TEST63 operator kit built from the pinned airoha-ursusboot release).
on:
  workflow_dispatch:
    inputs:
      unameone_md_url:
        description: Optional stable URL for exact pinned UnameOne 2026-09-16 MD UBI ITB
        required: false
        type: string
      unameone_mf_url:
        description: Optional stable URL for exact pinned UnameOne 2026-09-16 MF UBI ITB
        required: false
        type: string
permissions: { contents: read }
concurrency:
  group: vanilla-pregnant-proven-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { path: kit, fetch-depth: 1 }
      - name: Host and safety QA
        working-directory: kit
        run: |
          set -euo pipefail
          python3 -m py_compile ursusflasher/src/stock_ab_pregnant.py ursusflasher/src/stock_slot_telnet.py ursusflasher/src/one_key_multi.py ursusflasher/src/stock_fit_initramfs.py ursusflasher/tools/build_pregnant_runtime.py ursusflasher/tools/repack_vanilla_fip.py ursusflasher/tools/assemble_pregnant_payload.py ursusflasher/tools/selftest_pregnant_item4.py
          python3 ursusflasher/tools/selftest_pregnant_item4.py
          sh -n ursusboot/scripts/build_md_pregnant_handoff.sh
          sh -n openwrt/pregnant-overlay/usr/sbin/ursus-vanilla-stage2
          sh -n openwrt/pregnant-overlay/usr/sbin/ursusstockslot
          sh -n openwrt/pregnant-overlay/etc/init.d/ursus-pregnant
          sh -n openwrt/pregnant-overlay/etc/uci-defaults/99-ursus-pregnant
          grep -Fq 'out[4:] != flag[4:]' ursusflasher/src/stock_ab_transition.py
          ! grep -R -- '--force' openwrt/pregnant-overlay ursusflasher/src/stock_ab_pregnant.py
          grep -Fq 'Type YES to continue' ursusflasher/src/stock_ab_pregnant.py
      - name: Fetch current official UBI-recovery inputs
        run: |
          set -euo pipefail
          mkdir -p work/snapshot/md work/snapshot/mf
          fetch_family() {
            family="$1"; target="$2"; device="$3"; base="https://downloads.openwrt.org/snapshots/targets/airoha/$target"; dir="work/snapshot/$family"
            curl -fL --retry 5 "$base/sha256sums" -o "$dir/sha256sums"
            curl -fL --retry 5 "$base/version.buildinfo" -o "$dir/version.buildinfo"
            for name in "openwrt-airoha-$target-$device-ubi-initramfs-recovery.itb"; do
              grep -E "[[:space:]]\\*?$name$" "$dir/sha256sums" | head -n1 > "$dir/$name.sha256.line"
              test -s "$dir/$name.sha256.line"; curl -fL --retry 5 "$base/$name" -o "$dir/$name"; (cd "$dir" && sha256sum -c "$name.sha256.line")
            done
          }
          fetch_family md an7581 nokia_xg-040g-md
          fetch_family mf an7583 nokia_xg-040g-mf
          echo "MD_SNAPSHOT=$(cat work/snapshot/md/version.buildinfo)" >> "$GITHUB_ENV"
          echo "MF_SNAPSHOT=$(cat work/snapshot/mf/version.buildinfo)" >> "$GITHUB_ENV"
      - name: Build hardware-proven MD stock handoff
        working-directory: kit
        run: |
          set -euo pipefail
          bash ursusboot/scripts/build_md_pregnant_handoff.sh
          test -s work/md-pregnant-handoff/out/ursusboot-md-0.1.0-alpha5-UBIUX1-PREGNANT1.linuximg
          grep -Fq 'MODE=PREGNANT_HANDOFF' work/md-pregnant-handoff/out/PREGNANT-HANDOFF-BUILD_INFO.txt
          grep -aFq 'URSPREG1' work/md-pregnant-handoff/out/ursusboot-md-0.1.0-alpha5-UBIUX1-PREGNANT1.linuximg
          echo "MD_STOCK_HANDOFF_QA=PASS"

      - name: Build linked-newc pregnant runtimes
        run: |
          set -euo pipefail; mkdir -p work/runtime
          python3 kit/ursusflasher/tools/build_pregnant_runtime.py --family md --input work/snapshot/md/openwrt-airoha-an7581-nokia_xg-040g-md-ubi-initramfs-recovery.itb --overlay kit/openwrt/pregnant-overlay --output work/runtime/md-runtime.itb
          python3 kit/ursusflasher/tools/build_pregnant_runtime.py --family mf --input work/snapshot/mf/openwrt-airoha-an7583-nokia_xg-040g-mf-ubi-initramfs-recovery.itb --overlay kit/openwrt/pregnant-overlay --output work/runtime/mf-runtime.itb
          PYTHONPATH=kit/ursusflasher/src python3 - <<'PY'
          from pathlib import Path
          import stock_fit_initramfs as s
          for fam in ("md","mf"):
              p=Path("work/runtime")/f"{fam}-runtime.itb"; info=s.source_fit_contract(p.read_bytes()); assert info["fit_total_size"]==p.stat().st_size; print(f"{fam.upper()}_RUNTIME_FIT_QA=PASS",info)
          PY
      - name: Fetch pinned proven Vanilla boot chain
        run: |
          set -euo pipefail
          cfg=kit/config/VANILLA_BOOT_CHAIN_PROFILES.json
          source_repo="$(jq -r '.source.repository' "$cfg")"
          source_commit="$(jq -r '.source.commit' "$cfg")"
          raw_base="$(jq -r '.source.raw_base' "$cfg")"
          test "$source_repo" = Medvedolog/nokia-router-medveflasher
          test "$source_commit" = 342cac4cb99a924f3d83eb8e4b5259490377704e
          mkdir -p work/bootchain/md work/bootchain/mf
          fetch_role() {
            profile="$1"; family="$2"; role="$3"; output="$4"
            path="$(jq -r ".profiles[\"$profile\"].$role.path" "$cfg")"
            size="$(jq -r ".profiles[\"$profile\"].$role.size" "$cfg")"
            sha="$(jq -r ".profiles[\"$profile\"].$role.sha256" "$cfg")"
            status="$(jq -r ".profiles[\"$profile\"].$role.status" "$cfg")"
            curl -fL --retry 5 "$raw_base/$source_commit/$path" -o "$output"
            test "$(stat -c %s "$output")" = "$size"
            echo "$sha  $output" | sha256sum -c -
            echo "BOOTCHAIN_QA=PASS profile=$profile role=$role status=$status sha256=$sha"
          }
          fetch_role xg040-md md fip work/bootchain/md/vanilla-bl31-uboot.fip
          fetch_role xg040-md md preloader work/bootchain/md/vanilla-preloader.bin
          fetch_role xg040-mf mf fip work/bootchain/mf/vanilla-bl31-uboot.fip
          fetch_role xg040-mf mf preloader work/bootchain/mf/vanilla-preloader.bin
          test "$(jq -r '.contracts.md_fudan_support_required' "$cfg")" = true
          test "$(jq -r '.profiles["xg040-md"].fip.status' "$cfg")" = HW_VERIFIED_BY_OPERATOR_FUDAN_MD
          echo "MD_FUDAN_BOOTCHAIN_QA=PASS sha256=$(jq -r '.profiles["xg040-md"].fip.sha256' "$cfg") provenance=$(jq -r '.profiles["xg040-md"].fip.status' "$cfg")"
          echo "BOOTCHAIN_SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
      - name: Stage operator tree and runtime components
        run: |
          set -euo pipefail
          ART=work/staging/operator; mkdir -p "$ART"; cp -a kit/START_EXPERT.cmd kit/START_ONECLICK.cmd kit/VERSION kit/README.md "$ART/"; cp -a kit/config kit/fw kit/payloads kit/ursusflasher kit/docs "$ART/"
          mkdir -p "$ART/openwrt"; cp -a kit/openwrt/pregnant-overlay "$ART/openwrt/"
          mkdir -p "$ART/ursusboot/configs" "$ART/ursusboot/patches" "$ART/ursusboot/scripts"
          cp kit/ursusboot/configs/ursusboot-pregnant-handoff.cfg "$ART/ursusboot/configs/"
          cp kit/ursusboot/configs/u-boot.TEST61.full.config "$ART/ursusboot/configs/"
          cp kit/ursusboot/patches/191-md-pregnant-handoff.patch "$ART/ursusboot/patches/"
          cp kit/ursusboot/scripts/build_md_pregnant_handoff.sh "$ART/ursusboot/scripts/"
          rm -rf "$ART/payloads/vanilla-pregnant"; mkdir -p "$ART/payloads/vanilla-pregnant/md" "$ART/payloads/vanilla-pregnant/mf"
          cp work/runtime/md-runtime.itb "$ART/payloads/vanilla-pregnant/md/runtime.itb"; cp work/bootchain/md/vanilla-bl31-uboot.fip "$ART/payloads/vanilla-pregnant/md/vanilla-bl31-uboot.fip"; cp work/bootchain/md/vanilla-preloader.bin "$ART/payloads/vanilla-pregnant/md/vanilla-preloader.bin"
          cp kit/work/md-pregnant-handoff/out/ursusboot-md-0.1.0-alpha5-UBIUX1-PREGNANT1.linuximg "$ART/payloads/vanilla-pregnant/md/pregnant-handoff.linuximg"
          cp work/runtime/mf-runtime.itb "$ART/payloads/vanilla-pregnant/mf/runtime.itb"; cp work/bootchain/mf/vanilla-bl31-uboot.fip "$ART/payloads/vanilla-pregnant/mf/vanilla-bl31-uboot.fip"; cp work/bootchain/mf/vanilla-preloader.bin "$ART/payloads/vanilla-pregnant/mf/vanilla-preloader.bin"
          cat > "$ART/payloads/vanilla-pregnant/NEEDS_PINNED_UNAMEONE.txt" <<EOF
          Exact UnameOne 2026-09-16 production children are intentionally not substituted by snapshots.
          MD SHA256 9b1f0899ca4ef610f6d87e8572d369adb420f104bda667556e8a0b5979f066dd
          MF SHA256 21dcf4c6ca64ea0c5bc3d601e4a8f99a3f002371b873f399f622cbd9223fd1d1
          Use ursusflasher/tools/assemble_pregnant_payload.py.
          EOF
          echo "$GITHUB_SHA" > "$ART/URSUSFLASHER_COMMIT.txt"; printf 'MD_SNAPSHOT=%s\nMF_SNAPSHOT=%s\nBOOTCHAIN_SOURCE_COMMIT=%s\n' "$MD_SNAPSHOT" "$MF_SNAPSHOT" "$BOOTCHAIN_SOURCE_COMMIT" > "$ART/PREGNANT_BUILD_INFO.txt"
          find "$ART" -type d -name __pycache__ -prune -exec rm -rf {} + || true
          (cd "$ART" && python3 ursusflasher/tools/selftest_pregnant_item4.py)
          (cd "$ART" && sh -n openwrt/pregnant-overlay/usr/sbin/ursus-vanilla-stage2 && sh -n openwrt/pregnant-overlay/usr/sbin/ursusstockslot)
          find "$ART" -type d -name __pycache__ -prune -exec rm -rf {} + || true
          (cd "$ART" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Probe exact UnameOne production inputs
        id: prod
        env:
          MD_URL: ${{ inputs.unameone_md_url }}
          MF_URL: ${{ inputs.unameone_mf_url }}
        run: |
          set -euo pipefail
          md_name=openwrt-airoha-an7581-nokia_xg-040g-md-ubi-squashfs-sysupgrade.itb; mf_name=openwrt-airoha-an7583-nokia_xg-040g-mf-ubi-squashfs-sysupgrade.itb; mkdir -p work/production
          if [ -n "${MD_URL:-}" ] && [ -n "${MF_URL:-}" ]; then curl -fL --retry 5 "$MD_URL" -o "work/production/$md_name"; curl -fL --retry 5 "$MF_URL" -o "work/production/$mf_name"; else cp "kit/fw/$md_name" "work/production/$md_name" 2>/dev/null || true; cp "kit/fw/$mf_name" "work/production/$mf_name" 2>/dev/null || true; fi
          ready=1; echo '9b1f0899ca4ef610f6d87e8572d369adb420f104bda667556e8a0b5979f066dd  work/production/'"$md_name" | sha256sum -c - || ready=0; echo '21dcf4c6ca64ea0c5bc3d601e4a8f99a3f002371b873f399f622cbd9223fd1d1  work/production/'"$mf_name" | sha256sum -c - || ready=0
          echo "ready=$ready" >> "$GITHUB_OUTPUT"; [ "$ready" = 1 ] || echo 'Exact pinned UnameOne inputs unavailable to runner; full artifact intentionally not assembled.'
      - name: Assemble exact full MD+MF payloads
        if: steps.prod.outputs.ready == '1'
        run: |
          set -euo pipefail; ART=work/staging/operator
          python3 kit/ursusflasher/tools/assemble_pregnant_payload.py --family md --runtime "$ART/payloads/vanilla-pregnant/md/runtime.itb" --production work/production/openwrt-airoha-an7581-nokia_xg-040g-md-ubi-squashfs-sysupgrade.itb --fip "$ART/payloads/vanilla-pregnant/md/vanilla-bl31-uboot.fip" --preloader "$ART/payloads/vanilla-pregnant/md/vanilla-preloader.bin" --handoff "$ART/payloads/vanilla-pregnant/md/pregnant-handoff.linuximg" --output-root "$ART/payloads/vanilla-pregnant" --source-commit "$GITHUB_SHA" --snapshot "$MD_SNAPSHOT"
          python3 kit/ursusflasher/tools/assemble_pregnant_payload.py --family mf --runtime "$ART/payloads/vanilla-pregnant/mf/runtime.itb" --production work/production/openwrt-airoha-an7583-nokia_xg-040g-mf-ubi-squashfs-sysupgrade.itb --fip "$ART/payloads/vanilla-pregnant/mf/vanilla-bl31-uboot.fip" --preloader "$ART/payloads/vanilla-pregnant/mf/vanilla-preloader.bin" --output-root "$ART/payloads/vanilla-pregnant" --source-commit "$GITHUB_SHA" --snapshot "$MF_SNAPSHOT"
          rm -f "$ART/payloads/vanilla-pregnant/NEEDS_PINNED_UNAMEONE.txt"; (cd "$ART" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cd work/staging; zip -qr "UrsusFlasher-VANILLA-PREGNANT-FULL-$GITHUB_SHA.zip" operator; sha256sum "UrsusFlasher-VANILLA-PREGNANT-FULL-$GITHUB_SHA.zip" > "UrsusFlasher-VANILLA-PREGNANT-FULL-$GITHUB_SHA.zip.sha256"
      - name: Upload CI staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-pregnant-staging-${{ github.sha }}
          path: work/staging/operator/
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact full migration kit
        if: steps.prod.outputs.ready == '1'
        uses: actions/upload-artifact@v4
        with:
          name: UrsusFlasher-VANILLA-PREGNANT-FULL-${{ github.sha }}
          path: |
            work/staging/UrsusFlasher-VANILLA-PREGNANT-FULL-${{ github.sha }}.zip
            work/staging/UrsusFlasher-VANILLA-PREGNANT-FULL-${{ github.sha }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Require exact full migration artifact
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.prod.outputs.ready }}" = 1 || {
            echo "FULL_BUILD_INCOMPLETE: exact pinned UnameOne 2026-09-16 MD/MF inputs were not available to this runner." >&2
            exit 1
          }
          test -s "work/staging/UrsusFlasher-VANILLA-PREGNANT-FULL-$GITHUB_SHA.zip"
          test -s "work/staging/UrsusFlasher-VANILLA-PREGNANT-FULL-$GITHUB_SHA.zip.sha256"
          echo "FULL_BUILD_ARTIFACT_GATE=PASS sha=$GITHUB_SHA"
