name: Build XG140 UrsusBoot Native Persistent Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - feature/xg140-ursusboot-ram-recovery
    paths:
      - .github/workflows/xg140-ursusboot-ram-recovery.yml
      - ursusboot/scripts/build_xg140_ram_recovery.sh
      - ursusboot/patches/140-xg140-ram1-dts.patch
      - ursusflasher/src/xg140_native_persistent_install.py
      - ursusflasher/src/xg140_emergency_persistent.py
      - ursusflasher/src/xg140_ursusboot_web_recovery.py
      - ursusflasher/src/ursus_web_client.py
      - ursusflasher/src/ui_terms.py
      - ursusflasher/src/proven_backend.py
      - ursusflasher/tools/repack_xg140_native_fip.py
      - ursusflasher/tools/selftest_xg140_native_fip_repack.py
      - config/UI_TERMS.json
      - ursusboot/configs/u-boot.TEST61.full.config
      - ursusboot/source/ursusboot-0.1.0-alpha5-UBIUX1-TEST61-source.tar.zst
      - toolchains/openwrt-sdk-r35906/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make perl python3 xz-utils zstd liblzma-dev device-tree-compiler

      - name: Test XG140 native FIP repacker
        run: |
          python3 ursusflasher/tools/selftest_xg140_native_fip_repack.py

      - name: Build XG140 UrsusBoot
        run: |
          set -o pipefail
          chmod +x ursusboot/scripts/build_xg140_ram_recovery.sh
          JOBS="$(nproc)" ursusboot/scripts/build_xg140_ram_recovery.sh 2>&1 | tee xg140-ursusboot-build.log

      - name: Collect artifact
        run: |
          set -e
          OUT=work/xg140-ram-recovery/out
          test -s "$OUT/u-boot.bin"
          test -s "$OUT/u-boot.lzma"
          test -s ursusflasher/tools/repack_xg140_native_fip.py
          grep -q 'CONFIG_DEFAULT_DEVICE_TREE="airoha/an7581-bell-xg-140g-md"' "$OUT/u-boot.xg140-native.config"
          grep -q '^CONFIG_ENV_IS_NOWHERE=y' "$OUT/u-boot.xg140-native.config"

          mkdir -p artifact/web-helper
          cp -av "$OUT"/* artifact/
          rm -f artifact/repack_persistent_fip.py
          cp -av xg140-ursusboot-build.log artifact/
          cp -av ursusflasher/src/xg140_native_persistent_install.py artifact/web-helper/
          cp -av ursusflasher/src/xg140_emergency_persistent.py artifact/web-helper/
          cp -av ursusflasher/src/xg140_ursusboot_web_recovery.py artifact/web-helper/
          cp -av ursusflasher/src/ursus_web_client.py artifact/web-helper/
          cp -av ursusflasher/src/ui_terms.py artifact/web-helper/
          cp -av ursusflasher/src/proven_backend.py artifact/web-helper/
          cp -av config/UI_TERMS.json artifact/web-helper/
          cp -av ursusflasher/tools/repack_xg140_native_fip.py artifact/
          cp -av "$OUT/u-boot.lzma" artifact/

          test -s artifact/web-helper/UI_TERMS.json
          test -s artifact/repack_xg140_native_fip.py
          test -s artifact/web-helper/proven_backend.py
          (
            cd artifact/web-helper
            python3 -c 'import ui_terms, proven_backend, ursus_web_client, xg140_native_persistent_install, xg140_emergency_persistent, xg140_ursusboot_web_recovery'
          )

          cat > artifact/START_EMERGENCY_XG140.cmd <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          py -3 web-helper\xg140_emergency_persistent.py %*
          if errorlevel 1 pause
          EOF

          cat > artifact/emergency.local.example.json <<'EOF'
          {
            "host": "192.168.1.1",
            "port": "auto",
            "backup": "C:\\path\\to\\this-router\\mtd0_bootloader.bin.gz",
            "tcboot_user": "",
            "tcboot_password": ""
          }
          EOF

          cat > artifact/START_INSTALL_PERSISTENT.cmd <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0web-helper"
          py -3 xg140_native_persistent_install.py
          if errorlevel 1 pause
          EOF

          cat > artifact/START_FLASH_XG140_SYSUPGRADE.cmd <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0web-helper"
          py -3 xg140_ursusboot_web_recovery.py
          if errorlevel 1 pause
          EOF

          cat > artifact/ORDER.txt <<'EOF'
          EMERGENCY AUTO PATH
          - START_EMERGENCY_XG140.cmd performs unattended UART -> RAM UrsusBoot -> native FIP rebuild ->
            upload -> persistent 512 KiB boot-area transaction -> full readback -> reboot.
          - No y/N is used in emergency mode.
          - emergency.local.json may be placed beside START_EMERGENCY_XG140.cmd for local-only backup path,
            COM selection and tcboot credentials. It is deliberately never generated by public CI.
          - Machine-fatal invariants remain: exact mtd0 geometry/native FIP lineage, protected env boundary,
            bootloader candidate validation and successful device readback.

          NORMAL ENGINEERING PATH
          1. RAM boot u-boot.bin from tcboot UART at 0x81e00000.
          2. Verify UrsusBoot WebFailsafe at 192.168.1.1.
          3. Run START_INSTALL_PERSISTENT.cmd.
          4. Select THIS ROUTER'S OWN mtd0_bootloader.bin or .bin.gz backup.
          5. The helper validates the native XG140 boot area and rebuilds the checksum-free native Nokia FIP,
             preserving every native entry byte-for-byte and replacing only final NT_FW/BL33 payload/size.
             No foreign checksum entry is synthesized when the stock donor does not contain one.
          6. Answer the single y/N after preflight.
          7. Wait for bootloader write/readback PASS; then reboot.
          8. Confirm UrsusBoot 0.1.0-xg140-native1 boots from NAND.
          9. Run START_FLASH_XG140_SYSUPGRADE.cmd with the correct Bell XG-140G-MD sysupgrade.
          EOF

          git rev-parse HEAD > artifact/ursusflasher.commit
          printf '%s\n' 'U-Boot DTS derived from OpenWrt an7581-nokia-xg-040g-md U-Boot DTS plus physical XG140 deltas' > artifact/xg140-dts-source.txt
          printf '%s\n' 'Persistent FIP donor is selected at install time from the operator own XG140 stock mtd0 backup; no XG040 donor is packaged.' > artifact/native-donor-policy.txt
          (cd artifact && find . -type f ! -name ARTIFACT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > ARTIFACT_SHA256SUMS.txt)
          find artifact -maxdepth 2 -type f -printf '%P\n' | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ursusboot-xg140-native1-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          retention-days: 14
