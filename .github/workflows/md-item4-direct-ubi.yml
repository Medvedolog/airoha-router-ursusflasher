name: MD+MF direct item4 test kit

# Canonical two-target operator kit: MD and MF are equal targets. Embeds the
# TEST62 + fast BL2 builds of this exact commit for both boards and verifies
# the final ZIP (scripts/verify_test62_kit.py).

on:
  workflow_dispatch:
    inputs:
      md_run_id:
        description: 'Run ID of "MD AN7581 TEST62 + fast BL2" (empty = the run for this exact commit)'
        required: false
        default: ''
      mf_run_id:
        description: 'Run ID of "MF AN7583 TEST62 + fast BL2" (empty = the run for this exact commit)'
        required: false
        default: ''
  push:
    branches:
      - feature/ursusboot-modular-airoha
      - claude/lucid-gauss-t0il1g
    paths:
      - '.github/workflows/md-item4-direct-ubi.yml'
      - 'START_ONECLICK.cmd'
      - 'START_ONECLICK.sh'
      - 'START_EXPERT.cmd'
      - 'START_EXPERT.sh'
      - 'ursusflasher/src/**'
      - 'ursusflasher/tools/selftest_item4_direct_ubi.py'
      - 'config/**'
      - 'fw/**'
      - 'payloads/**'
      - 'scripts/build_public_release.py'
      - 'scripts/apply_md_test62_overlay.py'
      - 'scripts/apply_mf_test62_overlay.py'
      - 'scripts/verify_test62_kit.py'
      - 'scripts/repo_common.py'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # Waits for the same-commit MD and MF TEST62 + fast BL2 builds (~40-60 min).
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Host contract QA
        run: |
          set -euo pipefail
          python3 -m py_compile ursusflasher/src/*.py ursusflasher/tools/selftest_item4_direct_ubi.py scripts/*.py
          python3 ursusflasher/tools/selftest_item4_direct_ubi.py

      - name: Resolve exact MD and MF TEST62 + fast BL2 runs
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          MD_PIN: ${{ github.event.inputs.md_run_id }}
          MF_PIN: ${{ github.event.inputs.mf_run_id }}
        run: |
          set -euo pipefail
          # Only the TEST62 builds of this very commit are acceptable (unless pinned).
          resolve() {  # <prefix> <workflow file> <pin>
            local prefix="$1" wf="$2" pin="$3" run="" i
            if [ -n "$pin" ]; then
              run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pin")"
            else
              for i in $(seq 1 110); do
                run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$GITHUB_SHA&per_page=1" --jq '.workflow_runs[0] // empty')"
                if [ -n "$run" ] && [ "$(jq -r .status <<<"$run")" = completed ]; then break; fi
                echo "waiting for $wf of $GITHUB_SHA (poll $i)"
                sleep 180
              done
            fi
            test -n "$run"
            local id num sha conc
            id="$(jq -r .id <<<"$run")"; num="$(jq -r .run_number <<<"$run")"
            sha="$(jq -r .head_sha <<<"$run")"; conc="$(jq -r .conclusion <<<"$run")"
            echo "$wf run id=$id number=#$num head_sha=$sha conclusion=$conc"
            test "$(jq -r .path <<<"$run")" = ".github/workflows/$wf"
            test "$conc" = success
            { echo "${prefix}_id=$id"; echo "${prefix}_number=$num"; echo "${prefix}_sha=$sha"; } >> "$GITHUB_OUTPUT"
          }
          resolve md md-test62-build.yml "${MD_PIN:-}"
          resolve mf mf-test62-build.yml "${MF_PIN:-}"

      - uses: actions/download-artifact@v4
        with:
          name: ursusboot-md-TEST62-fast-bl2-${{ steps.runs.outputs.md_sha }}
          path: /tmp/md-test62-art
          run-id: ${{ steps.runs.outputs.md_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: ursusboot-mf-TEST62-fast-bl2-${{ steps.runs.outputs.mf_sha }}
          path: /tmp/mf-test62-art
          run-id: ${{ steps.runs.outputs.mf_id }}
          github-token: ${{ github.token }}

      - name: Assemble canonical MD+MF operator kit
        run: |
          set -euo pipefail
          rm -rf /tmp/kit-public
          cat /tmp/md-test62-art/TEST62-BUILD_INFO.txt
          cat /tmp/mf-test62-art/MF-RUNTIME-BUILD-INFO.txt
          python3 scripts/build_public_release.py --target all --out-dir /tmp/kit-public \
            --md-test62-dir /tmp/md-test62-art --mf-test62-dir /tmp/mf-test62-art

          ZIP="$(find /tmp/kit-public -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP" && test -s "$ZIP"
          python3 scripts/verify_test62_kit.py --zip "$ZIP" --artifacts /tmp/md-test62-art --mf-artifacts /tmp/mf-test62-art
          {
            echo "URSUSFLASHER_COMMIT=$GITHUB_SHA"
            echo "MD_TEST62_RUN_ID=${{ steps.runs.outputs.md_id }}"
            echo "MD_TEST62_RUN_NUMBER=${{ steps.runs.outputs.md_number }}"
            echo "MD_TEST62_HEAD_SHA=${{ steps.runs.outputs.md_sha }}"
            echo "MF_TEST62_RUN_ID=${{ steps.runs.outputs.mf_id }}"
            echo "MF_TEST62_RUN_NUMBER=${{ steps.runs.outputs.mf_number }}"
            echo "MF_TEST62_HEAD_SHA=${{ steps.runs.outputs.mf_sha }}"
            echo "ZIP_SHA256=$(sha256sum "$ZIP" | cut -d' ' -f1)"
          } > /tmp/kit-public/URSUSFLASHER_COMMIT.txt
          cat /tmp/kit-public/URSUSFLASHER_COMMIT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: UrsusFlasher-MD-MF-TEST62-${{ github.sha }}
          path: |
            /tmp/kit-public/*.zip
            /tmp/kit-public/*.sha256.txt
            /tmp/kit-public/URSUSFLASHER_COMMIT.txt
          if-no-files-found: error
          retention-days: 14
