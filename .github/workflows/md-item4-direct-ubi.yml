name: MD direct item4 test kit

on:
  workflow_dispatch:
    inputs:
      test62_run_id:
        description: 'Run ID of "MD AN7581 TEST62 + fast BL2" to embed (empty = pinned build #5)'
        required: false
        default: ''
  push:
    branches:
      - feature/ursusboot-modular-airoha
      - claude/lucid-gauss-t0il1g
    paths:
      - '.github/workflows/md-item4-direct-ubi.yml'
      - 'START_ONECLICK.cmd'
      - 'START_ONECLICK.sh'
      - 'START_EXPERT.cmd'
      - 'START_EXPERT.sh'
      - 'ursusflasher/src/expert.py'
      - 'ursusflasher/src/expert_airoha.py'
      - 'ursusflasher/src/ursusboot_pregnant.py'
      - 'ursusflasher/src/ursus_web_client.py'
      - 'ursusflasher/src/ursusboot_install.py'
      - 'ursusflasher/src/one_key.py'
      - 'ursusflasher/tools/selftest_item4_direct_ubi.py'
      - 'config/**'
      - 'fw/**'
      - 'payloads/md/ursusboot/**'
      - 'scripts/build_public_release.py'
      - 'scripts/apply_md_test62_overlay.py'
      - 'scripts/verify_md_item4_kit.py'
      - 'scripts/repo_common.py'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Host contract QA
        run: |
          set -euo pipefail
          python3 -m py_compile             ursusflasher/src/expert.py             ursusflasher/src/ursusboot_pregnant.py             ursusflasher/src/ursus_web_client.py             ursusflasher/src/ursusboot_install.py             ursusflasher/src/one_key.py             ursusflasher/tools/selftest_item4_direct_ubi.py
          python3 ursusflasher/tools/selftest_item4_direct_ubi.py
          python3 - <<'PY'
          import pathlib
          import sys

          root = pathlib.Path('.').resolve()
          sys.path.insert(0, str(root / 'ursusflasher' / 'src'))

          import one_key

          for role in ('OPENWRT_UBI_SYSUPGRADE', 'STOCK_TO_UBI_PRELOADER_BL2_CANDIDATE'):
              p = one_key.require_bundle_role(role)
              got = one_key.sha256(p)
              print(f'{role}=PASS path={p} size={p.stat().st_size} sha256={got}')
          PY

      - name: Resolve exact TEST62 + fast BL2 run
        id: test62
        env:
          GH_TOKEN: ${{ github.token }}
          # Exact TEST62 + fast BL2 build #5 (head 9b85007). Override only via dispatch input.
          PIN: ${{ github.event.inputs.test62_run_id || '35779344707' }}
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PIN")"
          test -n "$RUN" && test "$RUN" != null
          ID="$(jq -r .id <<<"$RUN")"; NUM="$(jq -r .run_number <<<"$RUN")"
          SHA="$(jq -r .head_sha <<<"$RUN")"; CONC="$(jq -r .conclusion <<<"$RUN")"
          test "$(jq -r .path <<<"$RUN")" = .github/workflows/md-test62-build.yml
          test "$CONC" = success
          echo "TEST62 run id=$ID number=#$NUM head_sha=$SHA conclusion=$CONC"
          { echo "id=$ID"; echo "number=$NUM"; echo "sha=$SHA"; } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: ursusboot-md-TEST62-fast-bl2-${{ steps.test62.outputs.sha }}
          path: /tmp/test62-art
          run-id: ${{ steps.test62.outputs.id }}
          github-token: ${{ github.token }}

      - name: Assemble canonical operator kit with TEST62 overlay
        run: |
          set -euo pipefail
          rm -rf /tmp/item4-public
          ls -la /tmp/test62-art
          cat /tmp/test62-art/TEST62-BUILD_INFO.txt
          python3 scripts/build_public_release.py --target md --out-dir /tmp/item4-public --md-test62-dir /tmp/test62-art

          ZIP="$(find /tmp/item4-public -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP" && test -s "$ZIP"
          python3 scripts/verify_md_item4_kit.py --zip "$ZIP" --artifacts /tmp/test62-art
          {
            echo "URSUSFLASHER_COMMIT=$GITHUB_SHA"
            echo "TEST62_RUN_ID=${{ steps.test62.outputs.id }}"
            echo "TEST62_RUN_NUMBER=${{ steps.test62.outputs.number }}"
            echo "TEST62_HEAD_SHA=${{ steps.test62.outputs.sha }}"
            echo "ZIP_SHA256=$(sha256sum "$ZIP" | cut -d' ' -f1)"
          } > /tmp/item4-public/URSUSFLASHER_COMMIT.txt
          cat /tmp/item4-public/URSUSFLASHER_COMMIT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: UrsusFlasher-MD-DIRECT-TEST62-${{ github.sha }}
          path: |
            /tmp/item4-public/*.zip
            /tmp/item4-public/*.sha256.txt
            /tmp/item4-public/URSUSFLASHER_COMMIT.txt
          if-no-files-found: error
          retention-days: 14
