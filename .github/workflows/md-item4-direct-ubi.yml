name: MD+MF direct item4 test kit

# Canonical two-target operator kit: MD and MF are equal targets. UrsusBoot comes
# from Medvedolog/airoha-ursusboot at the exact commit in config/URSUSBOOT_PIN.json,
# built by "UrsusBoot release (pinned airoha-ursusboot)" for exactly that pinned
# commit (reused across host-only changes); the kit fails closed on any commit/version/digest mismatch
# (scripts/apply_ursusboot_release.py, scripts/verify_kit.py).

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'Run ID of "UrsusBoot release (pinned airoha-ursusboot)" (empty = the run for this exact commit)'
        required: false
        default: ''
  push:
    branches:
      - main
      - feature/ursusboot-modular-airoha
      - claude/lucid-gauss-t0il1g
    paths:
      - '.github/workflows/md-item4-direct-ubi.yml'
      - 'START_ONECLICK.cmd'
      - 'START_ONECLICK.sh'
      - 'START_EXPERT.cmd'
      - 'START_EXPERT.sh'
      - 'ursusflasher/src/**'
      - 'ursusflasher/tools/selftest_item4_direct_ubi.py'
      - 'ursusflasher/tools/selftest_network_faults.py'
      - 'ursusflasher/tools/selftest_restore_routes.py'
      - 'ursusflasher/tools/selftest_mf_backup_gate.py'
      - 'ursusflasher/src/stock_restore.py'
      - 'config/**'
      - 'fw/**'
      - 'payloads/**'
      - 'scripts/build_public_release.py'
      - 'scripts/apply_ursusboot_release.py'
      - 'scripts/verify_kit.py'
      - 'scripts/verify_public_release.py'
      - 'docs/TEST64_TEST_RU.md'
      - 'config/URSUSBOOT_PIN.json'
      - 'scripts/repo_common.py'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # May wait for the UrsusBoot release build of the pinned commit (~40-60 min).
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Host contract QA
        run: |
          set -euo pipefail
          python3 -m py_compile ursusflasher/src/*.py ursusflasher/tools/selftest_item4_direct_ubi.py ursusflasher/tools/selftest_stock_service_provisioning.py scripts/*.py
          python3 ursusflasher/tools/selftest_item4_direct_ubi.py
          python3 ursusflasher/tools/selftest_network_faults.py
          python3 ursusflasher/tools/selftest_restore_routes.py
          python3 ursusflasher/tools/selftest_mf_backup_gate.py
          python3 ursusflasher/tools/selftest_stock_service_provisioning.py

      - name: Resolve the UrsusBoot release run for the pinned airoha-ursusboot commit
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          PIN_RUN: ${{ github.event.inputs.release_run_id }}
        run: |
          set -euo pipefail
          WF=ursusboot-release.yml
          COMMIT="$(python3 -c "import json; print(json.load(open('config/URSUSBOOT_PIN.json'))['commit'])")"
          # A release run qualifies only if it produced both boards' artifacts for the
          # pinned commit; their content is then verified against PROVENANCE.json.
          has_pin_artifacts() {
            local names
            names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')"
            grep -Fxq "ursusboot-xg040-md-$COMMIT" <<<"$names" && grep -Fxq "ursusboot-xg040-mf-$COMMIT" <<<"$names"
          }
          RUN_ID=""
          if [ -n "${PIN_RUN:-}" ]; then
            RUN_ID="$PIN_RUN"
          else
            for i in $(seq 1 110); do
              # 1) any successful release run that built the pinned commit (host-only changes reuse it)
              for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?status=success&per_page=30" --jq '.workflow_runs[].id'); do
                if has_pin_artifacts "$id"; then RUN_ID="$id"; break; fi
              done
              [ -n "$RUN_ID" ] && break
              # 2) otherwise a release run must be in flight for this very commit (pin just changed)
              RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?head_sha=$GITHUB_SHA&per_page=1" --jq '.workflow_runs[0] // empty')"
              # A release run for the pin may have been started by an earlier commit
              # (a host-only change pushed while it builds): keep waiting while any
              # release run is still queued or building; it may produce the pin's artifacts.
              ACTIVE="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?per_page=30" \
                --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
              if [ -z "$RUN" ] && [ "$ACTIVE" = 0 ] && [ "$i" -gt 3 ]; then
                echo "no release run for pinned $COMMIT and none started for $GITHUB_SHA; dispatch $WF" >&2; exit 1
              fi
              if [ -n "$RUN" ] && [ "$(jq -r .status <<<"$RUN")" = completed ] && [ "$(jq -r .conclusion <<<"$RUN")" != success ]; then
                echo "release run $(jq -r .id <<<"$RUN") for $GITHUB_SHA ended $(jq -r .conclusion <<<"$RUN")" >&2; exit 1
              fi
              echo "waiting for a $WF run with artifacts for $COMMIT (poll $i)"
              sleep 180
            done
          fi
          test -n "$RUN_ID"
          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          echo "$WF run id=$RUN_ID number=#$(jq -r .run_number <<<"$RUN") head_sha=$(jq -r .head_sha <<<"$RUN") conclusion=$(jq -r .conclusion <<<"$RUN")"
          test "$(jq -r .path <<<"$RUN")" = ".github/workflows/$WF"
          test "$(jq -r .conclusion <<<"$RUN")" = success
          has_pin_artifacts "$RUN_ID"
          TAG="$(python3 -c "import json; print(json.load(open('config/URSUSBOOT_PIN.json'))['version'].rsplit('-',1)[-1].upper())")"
          { echo "id=$RUN_ID"; echo "number=$(jq -r .run_number <<<"$RUN")"; echo "commit=$COMMIT"; echo "tag=$TAG"; } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: ursusboot-xg040-md-${{ steps.runs.outputs.commit }}
          path: /tmp/ursusboot/xg040-md
          run-id: ${{ steps.runs.outputs.id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: ursusboot-xg040-mf-${{ steps.runs.outputs.commit }}
          path: /tmp/ursusboot/xg040-mf
          run-id: ${{ steps.runs.outputs.id }}
          github-token: ${{ github.token }}

      - name: Assemble canonical MD+MF operator kit
        run: |
          set -euo pipefail
          rm -rf /tmp/kit-public
          cat /tmp/ursusboot/xg040-md/BUILD-INFO.txt /tmp/ursusboot/xg040-mf/BUILD-INFO.txt
          python3 scripts/build_public_release.py --target all --out-dir /tmp/kit-public \
            --ursusboot-md /tmp/ursusboot/xg040-md --ursusboot-mf /tmp/ursusboot/xg040-mf \
            --ursusboot-pin config/URSUSBOOT_PIN.json

          ZIP="$(find /tmp/kit-public -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP" && test -s "$ZIP"
          python3 scripts/verify_kit.py --zip "$ZIP" --ursusboot-md /tmp/ursusboot/xg040-md \
            --ursusboot-mf /tmp/ursusboot/xg040-mf --pin config/URSUSBOOT_PIN.json
          # The same boundary check public-test-release.yml applies before publishing.
          python3 scripts/verify_public_release.py /tmp/kit-public
          {
            echo "URSUSFLASHER_COMMIT=$GITHUB_SHA"
            echo "URSUSBOOT_REPO=Medvedolog/airoha-ursusboot"
            echo "URSUSBOOT_COMMIT=${{ steps.runs.outputs.commit }}"
            echo "URSUSBOOT_RELEASE_RUN_ID=${{ steps.runs.outputs.id }}"
            echo "URSUSBOOT_RELEASE_RUN_NUMBER=${{ steps.runs.outputs.number }}"
            echo "ZIP_SHA256=$(sha256sum "$ZIP" | cut -d' ' -f1)"
          } > /tmp/kit-public/URSUSFLASHER_COMMIT.txt
          cat /tmp/kit-public/URSUSFLASHER_COMMIT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: UrsusFlasher-MD-MF-${{ steps.runs.outputs.tag }}-${{ github.sha }}
          path: |
            /tmp/kit-public/*.zip
            /tmp/kit-public/*.sha256.txt
            /tmp/kit-public/URSUSFLASHER_COMMIT.txt
          if-no-files-found: error
          retention-days: 14
