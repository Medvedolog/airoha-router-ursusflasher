name: MD AN7581 TEST62 + fast BL2

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ursusboot-modular-airoha
      - claude/lucid-gauss-t0il1g
    paths:
      - '.github/workflows/md-test62-build.yml'
      - 'scripts/hook_atf_fastpath_patch.py'
      - 'ursusboot/scripts/build_alpha5_test62.sh'
      - 'ursusboot/patches/190-test62-buildid.patch'
      - 'ursusboot/patches/180-test61-safetyreg1.patch'
      - 'ursusboot/patches/170-test60-configtrim1.patch'
      - 'ursusboot/patches/160-test59-corrective.patch'
      - 'ursusboot/patches/150-test58-buildid.patch'
      - 'ursusboot/patches/140-test57-diagcap-resetnet1.patch'
      - 'ursusboot/patches/130-webfailsafe-webreboot1.patch'
      - 'ursusboot/source/ursusboot-0.1.0-alpha5-UBIUX1-source.tar.zst'
      - 'openwrt/patches/atf-airoha-083c14f-ubi-scan-fastpath.patch'
      - 'toolchains/**'

permissions:
  contents: read

env:
  OPENWRT_REF: 3d1645ee26d6a2e20be71d7fa1716721bac78e53
  ATF_FASTPATH_COMMIT: 083c14faf832cb2de3d7dc8368dc8fb1c8f6a1e5

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: ${{ env.OPENWRT_REF }}
          path: openwrt
          fetch-depth: 1

      - name: Build TEST62 BL33/FIP
        working-directory: kit
        env:
          JOBS: '2'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends liblzma-dev
          bash ursusboot/scripts/build_alpha5_test62.sh
          grep -Fq 'UrsusBoot 0.1.0-alpha5-UBIUX1-TEST62' work/alpha5-test62-rebuild/out/TEST62-BUILD_INFO.txt

      - name: Host dependencies for patched BL2
        run: |
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget jq time xz-utils zstd device-tree-compiler perl

      - name: Configure MD OpenWrt
        working-directory: openwrt
        run: |
          set -euo pipefail
          cat > .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y
          EOF
          make defconfig
          make download -j8
          find dl -type f -size -1024c -delete
          make -j"$(nproc)" tools/install V=s || make -j1 tools/install V=s
          make -j"$(nproc)" toolchain/install V=s || make -j1 toolchain/install V=s

      - name: Build TEST62 fast BL2 (patch hooked into Build/Prepare)
        working-directory: openwrt
        run: |
          set -euo pipefail
          # Patching build_dir after `prepare` is lost when `compile` re-runs
          # Build/Prepare (run #5 re-extracted atf-airoha and built an unpatched
          # BL2). The hook patches every extraction and fails if it does not apply.
          python3 ../kit/scripts/hook_atf_fastpath_patch.py --openwrt . \
            --patch "$GITHUB_WORKSPACE/kit/openwrt/patches/atf-airoha-083c14f-ubi-scan-fastpath.patch"
          make package/boot/arm-trusted-firmware-airoha/clean
          make -j"$(nproc)" package/boot/arm-trusted-firmware-airoha/compile V=s 2>&1 | tee ../atf-md.log \
            || make -j1 package/boot/arm-trusted-firmware-airoha/compile V=s 2>&1 | tee -a ../atf-md.log

          # Prove that the tree which was compiled last is the patched one.
          BL2DIR="$(find build_dir -maxdepth 2 -type d -name 'trusted-firmware-a-an7581-bl2' -print -quit)"
          test -n "$BL2DIR"
          SRC="$(find "$BL2DIR" -path '*/plat/ecnt/en7523/bl2_boot_nand_ubi.c' -print -quit)"
          test -n "$SRC"
          grep -Fq 'nandflash_read_range' "$SRC"
          grep -Fq 'nandflash_read_oob' "$(dirname "$SRC")/../common/drivers/flash/spi_nand_flash.c"
          grep -Fq 'patching file plat/ecnt/en7523/bl2_boot_nand_ubi.c' ../atf-md.log
          BL2="staging_dir/target-aarch64_cortex-a53_musl/image/an7581-bl2.bin"
          test -s "$BL2"
          test "$BL2" -nt "$SRC"
          ATF_SRC="$(sed -n 's/^[[:space:]]*SOURCE_VERSION:=//p' package/boot/arm-trusted-firmware-airoha/Makefile | head -n1)"
          echo "ATF_SOURCE_VERSION=$ATF_SRC" | tee ../atf-source.txt
          echo "ATF_FASTPATH_PATCH=PASS bl2=$BL2 sha256=$(sha256sum "$BL2" | cut -d' ' -f1)"

      - name: Assemble TEST62 artifact
        run: |
          set -euxo pipefail
          OUT=out-test62
          mkdir -p "$OUT"
          cp -a kit/work/alpha5-test62-rebuild/out/. "$OUT/"
          BL2=openwrt/staging_dir/target-aarch64_cortex-a53_musl/image/an7581-bl2.bin
          test -s "$BL2"
          cp "$BL2" "$OUT/openwrt-airoha-an7581-nokia-xg040md-TEST62-fast-ubi-preloader.bin"
          # BL33 inside the FIP is LZMA-compressed: check identity on raw u-boot.bin.
          grep -aFq '0.1.0-alpha5-UBIUX1-TEST62' "$OUT/u-boot.bin"
          test -s "$OUT/ursusboot-md-0.1.0-alpha5-UBIUX1-TEST62-update.fip"
          sha256sum "$OUT"/*.bin "$OUT"/*.fip "$OUT"/*.lzma | sort > "$OUT/SHA256SUMS.TEST62"
          cat >> "$OUT/TEST62-BUILD_INFO.txt" <<EOF
          ATF_FASTPATH_COMMIT=${ATF_FASTPATH_COMMIT}
          $(cat atf-source.txt)
          ATF_FASTPATH_PATCH_SHA256=$(sha256sum kit/openwrt/patches/atf-airoha-083c14f-ubi-scan-fastpath.patch | cut -d' ' -f1)
          ATF_FASTPATH_BL2=PASS
          LARGE_INITRAMFS_LMB_FIX=NOT_INCLUDED_IN_THIS_COMMIT
          HW_STATUS=HW_PENDING
          EOF
          cat "$OUT/TEST62-BUILD_INFO.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ursusboot-md-TEST62-fast-bl2-${{ github.sha }}
          path: out-test62/
          if-no-files-found: error
          retention-days: 14
