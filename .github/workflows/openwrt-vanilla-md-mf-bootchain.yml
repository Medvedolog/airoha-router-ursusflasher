name: Vanilla OpenWrt MD MF boot chain + fast BL2

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ursusboot-modular-airoha
      - claude/lucid-gauss-t0il1g
    paths:
      - '.github/workflows/openwrt-vanilla-md-mf-bootchain.yml'
      - 'scripts/hook_atf_fastpath_patch.py'
      - 'openwrt/patches/24025.patch'
      - 'openwrt/patches/atf-airoha-083c14f-ubi-scan-fastpath.patch'

permissions:
  contents: read

env:
  OPENWRT_REF: 3d1645ee26d6a2e20be71d7fa1716721bac78e53
  ATF_FASTPATH_COMMIT: 083c14faf832cb2de3d7dc8368dc8fb1c8f6a1e5

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: md
            target: an7581
            device: nokia_xg-040g-md-ubi
            bl2: an7581-bl2.bin
            uboot_variant: an7581_nokia_xg-040g-md
          - family: mf
            target: an7583
            device: nokia_xg-040g-mf-ubi
            bl2: an7583-bl2.bin
            uboot_variant: an7583_nokia_xg-040g-mf
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: ${{ env.OPENWRT_REF }}
          path: openwrt
          fetch-depth: 1

      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev liblzma-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget jq time xz-utils zstd device-tree-compiler perl

      - name: Configure target and Fudan-capable U-Boot
        working-directory: openwrt
        run: |
          set -euo pipefail
          git apply --check ../kit/openwrt/patches/24025.patch
          git apply ../kit/openwrt/patches/24025.patch
          cat > .config <<EOF
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_${{ matrix.target }}=y
          CONFIG_TARGET_airoha_${{ matrix.target }}_DEVICE_${{ matrix.device }}=y
          EOF
          make defconfig
          test -f package/boot/uboot-airoha/patches/120-mtd-spinand-fmsh-add-support-for-FM25G01B-FM25G02B.patch
          test -f package/boot/uboot-airoha/patches/121-mtd-spinand-fmsh-fix-FM25G01B-FM25G02B-Quad-IO-read-dummy-cycles.patch

      - name: Download and toolchain
        working-directory: openwrt
        run: |
          set -euo pipefail
          make download -j8
          find dl -type f -size -1024c -delete
          make -j"$(nproc)" tools/install V=s || make -j1 tools/install V=s
          make -j"$(nproc)" toolchain/install V=s || make -j1 toolchain/install V=s

      - name: Build patched BL2 and Vanilla U-Boot
        working-directory: openwrt
        run: |
          set -euo pipefail
          # The patch is hooked into Build/Prepare: patching build_dir after
          # `prepare` is lost when `compile` re-extracts atf-airoha.
          python3 ../kit/scripts/hook_atf_fastpath_patch.py --openwrt . \
            --patch "$GITHUB_WORKSPACE/kit/openwrt/patches/atf-airoha-083c14f-ubi-scan-fastpath.patch"
          make package/boot/arm-trusted-firmware-airoha/clean
          make -j"$(nproc)" package/boot/arm-trusted-firmware-airoha/compile V=s 2>&1 | tee ../atf-${{ matrix.family }}.log || make -j1 package/boot/arm-trusted-firmware-airoha/compile V=s 2>&1 | tee -a ../atf-${{ matrix.family }}.log
          BL2DIR="$(find build_dir -maxdepth 2 -type d -name 'trusted-firmware-a-${{ matrix.target }}-bl2' -print -quit)"
          test -n "$BL2DIR"
          SRC="$(find "$BL2DIR" -path '*/plat/ecnt/en7523/bl2_boot_nand_ubi.c' -print -quit)"
          test -n "$SRC"
          grep -Fq 'nandflash_read_range' "$SRC"
          grep -Fq 'nandflash_read_oob' "$(dirname "$SRC")/../common/drivers/flash/spi_nand_flash.c"
          grep -Fq 'patching file plat/ecnt/en7523/bl2_boot_nand_ubi.c' ../atf-${{ matrix.family }}.log
          BL2="staging_dir/target-aarch64_cortex-a53_musl/image/${{ matrix.bl2 }}"
          test -s "$BL2"
          test "$BL2" -nt "$SRC"
          echo "ATF_FASTPATH_PATCH=PASS upstream=${ATF_FASTPATH_COMMIT} bl2=$BL2 sha256=$(sha256sum "$BL2" | cut -d' ' -f1)"
          make -j"$(nproc)" package/boot/uboot-airoha/compile V=s 2>&1 | tee ../uboot-${{ matrix.family }}.log || make -j1 package/boot/uboot-airoha/compile V=s 2>&1 | tee -a ../uboot-${{ matrix.family }}.log

      - name: Verify and stage
        run: |
          set -euxo pipefail
          OUT="out-${{ matrix.family }}"
          mkdir -p "$OUT"
          BL2="openwrt/staging_dir/target-aarch64_cortex-a53_musl/image/${{ matrix.bl2 }}"
          test -s "$BL2"
          # OpenWrt builds U-Boot in build_dir/<target>/uboot-airoha-<variant>/uboot-airoha-<version>.
          # The Nokia variants do not set LZMA_COMPRESS, so the package leaves only u-boot.bin;
          # compress it here with the buildroot's own lzma, exactly as the package does for
          # LZMA_COMPRESS variants (LZMA-alone, as the FIP NT_FW expects).
          BIN="$(find openwrt/build_dir -type f -path '*/uboot-airoha-${{ matrix.uboot_variant }}/*' -name u-boot.bin -print -quit)"
          test -s "$BIN"
          UBDIR="$(dirname "$BIN")"
          LZMA="$OUT/u-boot.lzma"
          openwrt/staging_dir/host/bin/lzma e "$BIN" "$LZMA"
          test -s "$LZMA"
          # No `| head` under pipefail: an early-closing reader can SIGPIPE the writer.
          grep -aFq 'U-Boot 2026.07' "$BIN"
          grep -Fq 'FM25G02B' "$UBDIR/drivers/mtd/nand/spi/fmsh.c"
          cp "$BL2" "$OUT/openwrt-vanilla-${{ matrix.family }}-fast-ubi-bl2.bin"
          cp "$BIN" "$OUT/openwrt-vanilla-${{ matrix.family }}-fudan-u-boot.bin"
          mv "$LZMA" "$OUT/openwrt-vanilla-${{ matrix.family }}-fudan-u-boot.lzma"
          LZMA="$OUT/openwrt-vanilla-${{ matrix.family }}-fudan-u-boot.lzma"

          manifest=kit/config/VANILLA_BOOT_CHAIN_PROFILES.json
          profile="xg040-${{ matrix.family }}"
          donor_path="$(jq -r ".profiles[\"$profile\"].fip.path" "$manifest")"
          donor_commit="$(jq -r '.source.commit' "$manifest")"
          donor_base="$(jq -r '.source.raw_base' "$manifest")"
          curl -fL --retry 5 "$donor_base/$donor_commit/$donor_path" -o "$OUT/donor.fip"
          python3 kit/ursusflasher/tools/repack_vanilla_fip.py \
            --donor "$OUT/donor.fip" \
            --nt-fw "$LZMA" \
            --output "$OUT/openwrt-vanilla-${{ matrix.family }}-bl31-uboot-fudan.fip" \
            --require-marker "U-Boot 2026.07" \
            --require-marker "FM25G02B"
          rm -f "$OUT/donor.fip"
          sha256sum "$OUT"/*.bin "$OUT"/*.lzma "$OUT"/*.fip | tee "$OUT/SHA256SUMS"
          cat > "$OUT/BUILD_INFO.txt" <<EOF
          ROLE=VANILLA_OPENWRT_BOOT_CHAIN
          FAMILY=${{ matrix.family }}
          TARGET=${{ matrix.device }}
          OPENWRT_REF=${OPENWRT_REF}
          ATF_FASTPATH_UPSTREAM=${ATF_FASTPATH_COMMIT}
          ATF_FASTPATH=PASS
          FUDAN_UBOOT_PATCH=24025
          HARDWARE_STATUS=HW_PENDING
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-vanilla-${{ matrix.family }}-bootchain-${{ github.sha }}
          path: out-${{ matrix.family }}/
          if-no-files-found: error
          retention-days: 14
