name: Package UrsusFlasher 0.2.63 MF runtime-guard hotfix

on:
  push:
    branches:
      - feature/mf3-an7583-persistent
    paths:
      - '.github/workflows/package-0.2.63-hotfix.yml'
      - 'VERSION'
      - 'START_ONECLICK.cmd'
      - 'START_ONECLICK.sh'
      - 'START_EXPERT.cmd'
      - 'START_EXPERT.sh'
      - 'config/UI_TERMS.json'
      - 'ursusflasher/src/ui_terms.py'
      - 'ursusflasher/src/one_key_multi.py'
      - 'ursusflasher/src/expert_multi.py'
      - 'ursusflasher/src/stock_bootarea_restore.py'
      - 'ursusflasher/src/uart_bootarea_restore.py'
      - 'ursusflasher/tools/selftest_stateui3_enum_coverage.py'
      - 'ursusflasher/tools/selftest_stateui14_multiboard_registry.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Assert hotfix version
        run: test "$(cat VERSION)" = "0.2.63"

      - name: Source UI registry regression QA
        run: |
          python3 ursusflasher/tools/selftest_stateui3_enum_coverage.py
          python3 ursusflasher/tools/selftest_stateui14_multiboard_registry.py

      - name: Download last fully-audited 0.2.62 hardware kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base
          gh run download 34589613011 \
            --repo "$GITHUB_REPOSITORY" \
            --name ursusflasher-0.2.62-md-mf-minimal-hwtest \
            --dir base
          test -f base/UrsusFlasher-0.2.62.zip

      - name: Produce 0.2.63 host-only hotfix over audited payload set
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, zipfile

          oldzip = Path('base/UrsusFlasher-0.2.62.zip')
          work = Path('work/hotfix63')
          if work.exists():
              shutil.rmtree(work)
          work.mkdir(parents=True)
          with zipfile.ZipFile(oldzip) as z:
              z.extractall(work)

          oldroot = work / 'UrsusFlasher-0.2.62'
          root = work / 'UrsusFlasher-0.2.63'
          oldroot.rename(root)

          # Host-side changes only. Hardware payloads stay byte-for-byte from
          # the successful 0.2.62 full hardware-kit build (run 34589613011).
          shutil.copy2('START_ONECLICK.cmd', root / 'START_ONECLICK.cmd')
          shutil.copy2('START_ONECLICK.sh', root / 'START_ONECLICK.sh')
          shutil.copy2('START_EXPERT.cmd', root / 'START_EXPERT.cmd')
          shutil.copy2('START_EXPERT.sh', root / 'START_EXPERT.sh')
          shutil.copy2('VERSION', root / 'VERSION')
          shutil.copy2('VERSION', root / 'data' / 'VERSION')
          shutil.copy2('config/UI_TERMS.json', root / 'data' / 'UI_TERMS.json')
          for name in ('ui_terms.py', 'one_key_multi.py', 'expert_multi.py', 'stock_bootarea_restore.py', 'uart_bootarea_restore.py'):
              shutil.copy2(Path('ursusflasher/src') / name, root / 'data' / name)

          # v63 wrappers were a temporary hotfix layer and caused interface
          # drift. 0.2.63 now uses the canonical multi-board entrypoints.
          for name in ('one_key_v63.py', 'expert_v63.py'):
              p = root / 'data' / name
              if p.exists():
                  p.unlink()

          # UART boot-area restore is EXPERT item 4; do not duplicate it with
          # standalone root launchers.
          for name in ('START_UART_RESTORE.cmd', 'START_UART_RESTORE.sh'):
              p = root / name
              if p.exists():
                  p.unlink()

          # Stamp package-facing textual metadata without touching binaries.
          text_suffixes = {'.py', '.json', '.md', '.txt', '.cmd', '.sh'}
          for p in root.rglob('*'):
              if not p.is_file() or p.name in {'SHA256SUMS', 'PAYLOAD_SHA256SUMS.txt'}:
                  continue
              if p.suffix.lower() not in text_suffixes and p.name != 'VERSION':
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if '0.2.62' in s:
                  p.write_text(s.replace('0.2.62', '0.2.63'), encoding='utf-8', newline='\n')

          def sha256(p: Path) -> str:
              h = hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          manifest = root / 'SHA256SUMS'
          rows = []
          for p in sorted(root.rglob('*'), key=lambda x: x.relative_to(root).as_posix()):
              if p.is_file() and p != manifest:
                  rows.append(f'{sha256(p)}  {p.relative_to(root).as_posix()}')
          manifest.write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')

          out = Path('dist')
          out.mkdir(exist_ok=True)
          zpath = out / 'UrsusFlasher-0.2.63.zip'
          with zipfile.ZipFile(zpath, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(root.rglob('*'), key=lambda x: x.relative_to(root).as_posix()):
                  if p.is_file():
                      z.write(p, p.relative_to(root.parent))
          digest = sha256(zpath)
          (out / 'UrsusFlasher-0.2.63.zip.sha256.txt').write_text(
              f'{digest}  {zpath.name}\n', encoding='utf-8', newline='\n')
          print('HOTFIX63_ZIP', zpath, zpath.stat().st_size, digest)
          PY

      - name: Package and startup regression QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import contextlib, hashlib, io, json, os, shutil, sys, zipfile

          zpath = Path('dist/UrsusFlasher-0.2.63.zip')
          with zipfile.ZipFile(zpath) as z:
              r = 'UrsusFlasher-0.2.63/'
              names = set(z.namelist())
              assert r + 'START_ONECLICK.cmd' in names
              assert r + 'START_EXPERT.cmd' in names
              assert r + 'data/one_key_multi.py' in names
              assert r + 'data/expert_multi.py' in names
              assert r + 'data/ui_terms.py' in names
              assert r + 'data/UI_TERMS.json' in names
              assert r + 'data/one_key_v63.py' not in names
              assert r + 'data/expert_v63.py' not in names
              assert r + 'START_UART_RESTORE.cmd' not in names
              assert r + 'START_UART_RESTORE.sh' not in names
              assert z.read(r + 'VERSION') == b'0.2.63\n'
              assert z.read(r + 'data/VERSION') == b'0.2.63\n'
              assert b'one_key_multi.py' in z.read(r + 'START_ONECLICK.cmd')
              assert b'expert_multi.py' in z.read(r + 'START_EXPERT.cmd')
              assert b'_v63.py' not in z.read(r + 'START_ONECLICK.cmd')
              assert b'_v63.py' not in z.read(r + 'START_EXPERT.cmd')

              terms_json = json.loads(z.read(r + 'data/UI_TERMS.json'))
              assert terms_json['version'] >= 14
              item4 = terms_json['expert_actions']['restore_factory_bootarea']
              assert item4['number'] == 4
              assert item4['ru'] == 'Восстановить заводской загрузчик Nokia'
              assert terms_json['expert_actions']['custom_openwrt']['ru'] == 'Установить свою прошивку OpenWrt'
              assert terms_json['expert_actions']['recover_bootloader']['ru'] == 'Восстановить загрузчик через USB-UART'
              assert 'UART_BOOTAREA_FACTORY_RESTORE' in terms_json['methods']
              assert 'MF_DEVICE_DERIVED_HOST_ONLY' in terms_json['methods']
              assert 'AUTO_URSUSBOOT_INSTALL_UPDATE' in terms_json['methods']
              assert 'AUTO_URSUSBOOT_INSTALL_UPDATE' not in terms_json['execution_environments']

              mf_stock = z.read(r + 'data/payloads/mf/stock/nokia-xg-040g-mf-stock-mtd0.bin')
              assert len(mf_stock) == 524288
              assert hashlib.sha256(mf_stock).hexdigest() == '144d63272049eeb7122a01f2f3a0192b874ca4c68c10a5b4726fa4c2e84ac1bf'
              md_stock = z.read(r + 'data/payloads/md/stock/nokia-xg-040g-md-stock-mtd0.bin')
              assert len(md_stock) == 524288
              assert hashlib.sha256(md_stock).hexdigest() == 'c98f268db69fb3d8ab3ba7bd11f9aa0cc3bfbaacf5b952e7a4e25094476bb629'
              mf_bl2 = z.read(r + 'data/payloads/mf/proven/nokia-xg-040g-mf-an7583-production-preloader.bin')
              assert hashlib.sha256(mf_bl2).hexdigest() == '778d10a65276085b70bec005248fc87ec208b43b0239502f15ade20fe528301e'
              forbidden = ('transition-bundle.bin', 'transition-manual-bundle.bin', 'mf-transition-bundle.bin', 'mf-transition-manual-bundle.bin', 'vendor/')
              assert not [n for n in names if any(x in n for x in forbidden)]

          smoke = Path('work/smoke63')
          if smoke.exists():
              shutil.rmtree(smoke)
          with zipfile.ZipFile(zpath) as z:
              z.extractall(smoke)
          root = smoke / 'UrsusFlasher-0.2.63'
          data_dir = root / 'data'
          sys.path.insert(0, str(data_dir))
          os.environ['NOKIA_LANG'] = 'ru'

          import ui_terms
          assert ui_terms.action_title('restore_factory_bootarea') == 'Восстановить заводской загрузчик Nokia'
          assert ui_terms.action_title('future_action_key') == 'future_action_key'
          assert ui_terms.human('FUTURE_METHOD', 'method') == 'FUTURE_METHOD'
          assert ui_terms.human('UART_BOOTAREA_FACTORY_RESTORE', 'method').startswith('Через USB-UART')

          import one_key_multi
          assert one_key_multi.mf_runtime_mode({'persistent_write_enabled': True, 'ram_read_only': False}) == 'PERSISTENT_RUNTIME'
          assert one_key_multi.mf_runtime_mode({'persistent_write_enabled': False, 'ram_read_only': True}) == 'RAM_ONLY'
          assert one_key_multi.mf_runtime_mode({'version': '0.1.0-TEST61'}) == 'LEGACY_RAM_ONLY'

          import device_state as ds
          import expert_multi
          assert ds.ACTION_KEYS[4] == 'restore_factory_bootarea'
          for state in (
              ds.DeviceState(),
              ds.DeviceState(current_system='RECOVERY', current_layout='OPENWRT_UBI', bootloader='URSUSBOOT', evidence={'board_profile':'mf'}),
          ):
              app = expert_multi.action_applicability(state)
              for number, action in app.items():
                  assert action.key == ds.ACTION_KEYS[number]
                  assert action.key in ui_terms._DATA['expert_actions']
          mf_app = expert_multi.action_applicability(ds.DeviceState(current_system='RECOVERY', evidence={'board_profile':'mf'}))
          assert mf_app[2].resolved_backend == 'MF_DEVICE_DERIVED_HOST_ONLY'
          assert expert_multi.action_applicability(ds.DeviceState())[4].resolved_backend == 'UART_BOOTAREA_FACTORY_RESTORE'

          # Verify the disabled-item renderer discards detail and leaves only reason.
          app = expert_multi.action_applicability(ds.DeviceState())
          assert not app[3].enabled and app[3].reason
          captured = []
          original_show = expert_multi.base._show_action
          expert_multi.base._show_action = lambda number, app, detail_ru='', detail_en='': captured.append((number, detail_ru, detail_en))
          try:
              expert_multi._show_action(3, app, 'DUPLICATE DETAIL', 'DUPLICATE DETAIL')
          finally:
              expert_multi.base._show_action = original_show
          assert captured == [(3, '', '')]

          expert_multi.base.one_key.choose_language = lambda: None
          expert_multi.ds.probe_device_state = lambda host: ds.DeviceState(host=host)
          expert_multi.base.ask_menu = lambda max_item: '0'
          expert_multi.base.proven.start_session_logging = lambda: None
          output = io.StringIO()
          with contextlib.redirect_stdout(output):
              rc = expert_multi.main()
          rendered = output.getvalue()
          assert rc == 0
          assert 'Восстановить заводской загрузчик Nokia' in rendered
          assert 'Восстановить загрузчик через USB-UART' in rendered
          assert 'ЕСЛИ РОУТЕР НЕ ЗАГРУЖАЕТСЯ' in rendered.upper()
          assert rendered.count('Доступно из установленной OpenWrt или UrsusBoot Recovery') == 1

          expert_source = (data_dir / 'expert_multi.py').read_text(encoding='utf-8')
          item4_block = expert_source.split('elif number == 4:', 1)[1].split('elif number == 5:', 1)[0]
          assert 'confirm_uart_recovery' not in item4_block

          print('MF_RUNTIME_MODE_GUARD=PASS')
          print('STATEUI14_ACTION_REGISTRY=PASS')
          print('EXPERT_ITEM4_UI=PASS')
          print('EXPERT_DISABLED_REASON_DEDUP=PASS')
          print('EXPERT_MENU_SMOKE=PASS')
          print('CANONICAL_ENTRYPOINTS=PASS')
          PY
          python3 -m py_compile \
            work/smoke63/UrsusFlasher-0.2.63/data/ui_terms.py \
            work/smoke63/UrsusFlasher-0.2.63/data/one_key_multi.py \
            work/smoke63/UrsusFlasher-0.2.63/data/expert_multi.py

      - name: Stage artifact
        run: |
          mkdir -p upload
          cp dist/UrsusFlasher-0.2.63.zip upload/
          cp dist/UrsusFlasher-0.2.63.zip.sha256.txt upload/
          sha256sum upload/UrsusFlasher-0.2.63.zip > upload/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ursusflasher-0.2.63-mf-runtime-guard-hwtest
          path: upload/
          if-no-files-found: error
