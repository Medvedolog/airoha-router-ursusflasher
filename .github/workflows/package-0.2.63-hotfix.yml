name: Package UrsusFlasher 0.2.63 MF stock-install fix

on:
  push:
    branches:
      - feature/mf3-an7583-persistent
    paths:
      - '.github/workflows/package-0.2.63-hotfix.yml'
      - 'VERSION'
      - 'START_ONECLICK.cmd'
      - 'START_ONECLICK.sh'
      - 'START_EXPERT.cmd'
      - 'START_EXPERT.sh'
      - 'config/**'
      - 'ursusflasher/src/**'
      - 'ursusflasher/tools/selftest_stateui3_enum_coverage.py'
      - 'ursusflasher/tools/selftest_stateui6_action_preflight.py'
      - 'ursusflasher/tools/selftest_stateui14_multiboard_registry.py'
      - 'ursusflasher/tools/selftest_mf_stock_access.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Assert hotfix version
        run: test "$(cat VERSION)" = "0.2.63"

      - name: Source regression QA
        run: |
          python3 -m py_compile ursusflasher/src/*.py
          python3 ursusflasher/tools/selftest_stateui3_enum_coverage.py
          python3 ursusflasher/tools/selftest_stateui6_action_preflight.py
          python3 ursusflasher/tools/selftest_stateui14_multiboard_registry.py
          python3 ursusflasher/tools/selftest_mf_stock_access.py

      - name: Download last fully-audited 0.2.62 hardware kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base
          gh run download 34589613011 \
            --repo "$GITHUB_REPOSITORY" \
            --name ursusflasher-0.2.62-md-mf-minimal-hwtest \
            --dir base
          test -f base/UrsusFlasher-0.2.62.zip

      - name: Produce 0.2.63 host fix over audited payload set
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, shutil, zipfile

          oldzip = Path('base/UrsusFlasher-0.2.62.zip')
          work = Path('work/hotfix63')
          if work.exists():
              shutil.rmtree(work)
          work.mkdir(parents=True)
          with zipfile.ZipFile(oldzip) as z:
              z.extractall(work)

          oldroot = work / 'UrsusFlasher-0.2.62'

          def sha256(p: Path) -> str:
              h = hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          # Freeze every hardware payload and firmware image from the last
          # fully-audited 0.2.62 kit. This hotfix changes host Python/UI only.
          frozen = {}
          for base_rel in ('data/payloads', 'fw'):
              base = oldroot / base_rel
              for p in base.rglob('*'):
                  if p.is_file():
                      frozen[p.relative_to(oldroot).as_posix()] = sha256(p)

          root = work / 'UrsusFlasher-0.2.63'
          oldroot.rename(root)

          for name in (
              'START_ONECLICK.cmd', 'START_ONECLICK.sh',
              'START_EXPERT.cmd', 'START_EXPERT.sh',
              'VERSION',
          ):
              shutil.copy2(name, root / name)
          shutil.copy2('VERSION', root / 'data' / 'VERSION')

          # Canonical source parity rule: every current runtime source file is
          # overlaid into data/ by relative path. No hand-maintained file list.
          src_root = Path('ursusflasher/src')
          current_top_py = set()
          for src in sorted(src_root.rglob('*')):
              if not src.is_file() or src.name.endswith(('.pyc', '.pyo')) or '__pycache__' in src.parts:
                  continue
              rel = src.relative_to(src_root)
              out = root / 'data' / rel
              out.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, out)
              if len(rel.parts) == 1 and rel.suffix == '.py':
                  current_top_py.add(rel.name)

          # Remove stale top-level Python modules inherited from the 0.2.62
          # archive. New runtime modules appear automatically by the rule above;
          # removed modules disappear automatically here.
          for packed in (root / 'data').glob('*.py'):
              if packed.name not in current_top_py:
                  packed.unlink()

          # Runtime registries used by the current host code are canonical too.
          for name in (
              'UI_TERMS.json',
              'FIRMWARE_CAPABILITIES.json',
              'BOARD_PROFILES.json',
              'FIRMWARE_BUNDLES.json',
          ):
              shutil.copy2(Path('config') / name, root / 'data' / name)

          (root / 'BUILD_COMMIT.txt').write_text(
              os.environ['GITHUB_SHA'] + '\n', encoding='ascii', newline='\n'
          )

          # Historical wrapper/standalone launchers are not part of the public
          # operator surface; EXPERT item 4 owns UART factory boot-area restore.
          for name in ('one_key_v63.py', 'expert_v63.py'):
              p = root / 'data' / name
              if p.exists():
                  p.unlink()
          for name in ('START_UART_RESTORE.cmd', 'START_UART_RESTORE.sh'):
              p = root / name
              if p.exists():
                  p.unlink()

          # Only package metadata/docs inherited from the audited archive are
          # version-stamped. Canonical source bytes under data/ are never edited.
          stamp_targets = [root / 'README.md', root / 'data' / 'MANIFEST.json']
          stamp_targets += list((root / 'doc').glob('*.md')) if (root / 'doc').is_dir() else []
          for p in stamp_targets:
              if not p.is_file():
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if '0.2.62' in text:
                  p.write_text(text.replace('0.2.62', '0.2.63'), encoding='utf-8', newline='\n')

          # Hardware bytes must remain exactly those of audited 0.2.62.
          for rel, expected in frozen.items():
              p = root / rel
              if not p.is_file():
                  raise AssertionError(f'frozen hardware file disappeared: {rel}')
              got = sha256(p)
              if got != expected:
                  raise AssertionError(f'frozen hardware file changed: {rel}: {got} != {expected}')

          manifest = root / 'SHA256SUMS'
          rows = []
          for p in sorted(root.rglob('*'), key=lambda x: x.relative_to(root).as_posix()):
              if p.is_file() and p != manifest:
                  rows.append(f'{sha256(p)}  {p.relative_to(root).as_posix()}')
          manifest.write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')

          out = Path('dist')
          out.mkdir(exist_ok=True)
          zpath = out / 'UrsusFlasher-0.2.63.zip'
          with zipfile.ZipFile(zpath, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(root.rglob('*'), key=lambda x: x.relative_to(root).as_posix()):
                  if p.is_file():
                      z.write(p, p.relative_to(root.parent))
          digest = sha256(zpath)
          (out / 'UrsusFlasher-0.2.63.zip.sha256.txt').write_text(
              f'{digest}  {zpath.name}\n', encoding='utf-8', newline='\n'
          )
          print('HOTFIX63_ZIP', zpath, zpath.stat().st_size, digest)
          print('FROZEN_HARDWARE_FILES', len(frozen))
          PY

      - name: Package source parity and startup regression QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import contextlib, hashlib, io, json, os, shutil, sys, zipfile

          zpath = Path('dist/UrsusFlasher-0.2.63.zip')
          with zipfile.ZipFile(zpath) as z:
              r = 'UrsusFlasher-0.2.63/'
              names = set(z.namelist())
              assert r + 'START_ONECLICK.cmd' in names
              assert r + 'START_EXPERT.cmd' in names
              assert r + 'BUILD_COMMIT.txt' in names
              assert z.read(r + 'BUILD_COMMIT.txt').decode().strip() == os.environ['GITHUB_SHA']
              assert z.read(r + 'VERSION') == b'0.2.63\n'
              assert z.read(r + 'data/VERSION') == b'0.2.63\n'
              assert b'one_key_multi.py' in z.read(r + 'START_ONECLICK.cmd')
              assert b'expert_multi.py' in z.read(r + 'START_EXPERT.cmd')
              assert r + 'data/one_key_v63.py' not in names
              assert r + 'data/expert_v63.py' not in names
              assert r + 'START_UART_RESTORE.cmd' not in names
              assert r + 'START_UART_RESTORE.sh' not in names

              # PACKAGED_SOURCE_PARITY is derived from the canonical src tree,
              # not a manually maintained tuple of selected files.
              src_root = Path('ursusflasher/src')
              canonical_top_py = set()
              checked = 0
              for src in sorted(src_root.rglob('*')):
                  if not src.is_file() or src.name.endswith(('.pyc', '.pyo')) or '__pycache__' in src.parts:
                      continue
                  rel = src.relative_to(src_root).as_posix()
                  packed_name = r + 'data/' + rel
                  assert packed_name in names, packed_name
                  assert z.read(packed_name) == src.read_bytes(), rel
                  checked += 1
                  if '/' not in rel and rel.endswith('.py'):
                      canonical_top_py.add(rel)
              packed_top_py = {
                  n.rsplit('/', 1)[-1]
                  for n in names
                  if n.startswith(r + 'data/') and n.count('/') == 2 and n.endswith('.py')
              }
              assert packed_top_py == canonical_top_py, (packed_top_py - canonical_top_py, canonical_top_py - packed_top_py)

              for name in ('UI_TERMS.json', 'FIRMWARE_CAPABILITIES.json', 'BOARD_PROFILES.json', 'FIRMWARE_BUNDLES.json'):
                  assert z.read(r + 'data/' + name) == (Path('config') / name).read_bytes(), name

              mf_source = z.read(r + 'data/mf_runtime_install.py').decode('utf-8')
              assert 'pb._install_access(pb.MF_INSTALL_PROFILE)' in mf_source
              stock_block = mf_source.split('def install_from_stock(', 1)[1].split('def run_install(', 1)[0]
              assert 'pb.ask_credentials(require_model_gate=True' not in stock_block
              assert '_open_stock_access_interactive()' in stock_block

              terms_json = json.loads(z.read(r + 'data/UI_TERMS.json'))
              assert terms_json['expert_actions']['restore_factory_bootarea']['ru'] == 'Вернуть заводской загрузчик Nokia (UrsusBoot будет удалён)'
              assert terms_json['expert_actions']['recover_bootloader']['ru'] == 'Починить UrsusBoot, если он не запускается'
              assert terms_json['expert_actions']['restore_nokia']['ru'] == 'Вернуть роутер к заводскому состоянию целиком'

              mf_stock = z.read(r + 'data/payloads/mf/stock/nokia-xg-040g-mf-stock-mtd0.bin')
              assert len(mf_stock) == 524288
              assert hashlib.sha256(mf_stock).hexdigest() == '144d63272049eeb7122a01f2f3a0192b874ca4c68c10a5b4726fa4c2e84ac1bf'
              mf_bl2 = z.read(r + 'data/payloads/mf/proven/nokia-xg-040g-mf-an7583-production-preloader.bin')
              assert hashlib.sha256(mf_bl2).hexdigest() == '778d10a65276085b70bec005248fc87ec208b43b0239502f15ade20fe528301e'
              forbidden = ('transition-bundle.bin', 'transition-manual-bundle.bin', 'mf-transition-bundle.bin', 'mf-transition-manual-bundle.bin', 'vendor/')
              assert not [n for n in names if any(x in n for x in forbidden)]
              print('PACKAGED_SOURCE_PARITY=PASS', checked)

          smoke = Path('work/smoke63')
          if smoke.exists():
              shutil.rmtree(smoke)
          with zipfile.ZipFile(zpath) as z:
              z.extractall(smoke)
          root = smoke / 'UrsusFlasher-0.2.63'
          data_dir = root / 'data'
          sys.path.insert(0, str(data_dir))
          os.environ['NOKIA_LANG'] = 'ru'

          import ui_terms
          assert ui_terms.action_title('restore_factory_bootarea') == 'Вернуть заводской загрузчик Nokia (UrsusBoot будет удалён)'
          assert ui_terms.action_title('recover_bootloader') == 'Починить UrsusBoot, если он не запускается'

          import device_state as ds
          assert ds.ACTION_KEYS[4] == 'restore_factory_bootarea'
          canonical_keys = dict(ds.ACTION_KEYS)
          canonical_applicability = ds.action_applicability

          import one_key_multi
          assert one_key_multi.mf_runtime_mode({'persistent_write_enabled': True, 'ram_read_only': False}) == 'PERSISTENT_RUNTIME'
          assert one_key_multi.mf_runtime_mode({'persistent_write_enabled': False, 'ram_read_only': True}) == 'RAM_ONLY'
          assert one_key_multi.mf_runtime_mode({'version': '0.1.0-TEST61'}) == 'LEGACY_RAM_ONLY'

          import expert_multi
          assert ds.ACTION_KEYS == canonical_keys
          assert ds.action_applicability is canonical_applicability
          mf_app = expert_multi.action_applicability(ds.DeviceState(current_system='RECOVERY', evidence={'board_profile': 'mf'}))
          assert mf_app[2].resolved_backend == 'MF_DEVICE_DERIVED_HOST_ONLY'
          assert 'заводской Nokia или из OpenWrt' in mf_app[2].reason
          assert expert_multi.action_applicability(ds.DeviceState())[4].resolved_backend == 'UART_BOOTAREA_FACTORY_RESTORE'

          # Disabled items must have only a reason; enabled notes get their own line.
          app = expert_multi.action_applicability(ds.DeviceState())
          assert not app[3].enabled and app[3].reason
          captured = []
          original_show = expert_multi.base._show_action
          expert_multi.base._show_action = lambda number, app, detail_ru='', detail_en='': captured.append((number, detail_ru, detail_en))
          try:
              expert_multi._show_action(3, app, 'DUPLICATE DETAIL', 'DUPLICATE DETAIL')
          finally:
              expert_multi.base._show_action = original_show
          assert captured == [(3, '', '')]

          expert_multi.base.one_key.choose_language = lambda: None
          expert_multi.ds.probe_device_state = lambda host: ds.DeviceState(host=host)
          expert_multi.base.ask_menu = lambda max_item: '0'
          expert_multi.base.proven.start_session_logging = lambda: None
          output = io.StringIO()
          with contextlib.redirect_stdout(output):
              rc = expert_multi.main()
          rendered = output.getvalue()
          assert rc == 0
          assert 'Вернуть заводской загрузчик Nokia (UrsusBoot будет удалён)' in rendered
          assert 'Починить UrsusBoot, если он не запускается' in rendered
          assert 'Вернуть роутер к заводскому состоянию целиком' in rendered

          print('MF_STOCK_ACCESS_ROUTE=PASS')
          print('CANONICAL_ACTION_REGISTRY=PASS')
          print('EXPERT_DISABLED_REASON_DEDUP=PASS')
          print('EXPERT_MENU_SMOKE=PASS')
          print('CANONICAL_ENTRYPOINTS=PASS')
          PY
          python3 -m py_compile work/smoke63/UrsusFlasher-0.2.63/data/*.py

      - name: Stage artifact
        run: |
          mkdir -p upload
          cp dist/UrsusFlasher-0.2.63.zip upload/
          cp dist/UrsusFlasher-0.2.63.zip.sha256.txt upload/
          sha256sum upload/UrsusFlasher-0.2.63.zip > upload/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ursusflasher-0.2.63-mf-stock-install-fix-hwtest
          path: upload/
          if-no-files-found: error
