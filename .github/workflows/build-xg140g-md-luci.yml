name: Build XG-140G-MD OpenWrt + LuCI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mf3-an7583-persistent
    paths:
      - .github/workflows/build-xg140g-md-luci.yml
      - START_XG140_INITRAMFS_TEST.cmd
      - ursusflasher/src/xg140_initramfs_test.py

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OPENWRT_REPO: hzyitc/openwrt-redmi-ax3000
      OPENWRT_REF: b27424f28a034ee1d18409b7952616ba9a40cca4
      PROFILE: bell_xg-140g-md
    steps:
      - name: Checkout UrsusFlasher tester
        uses: actions/checkout@v4
        with:
          path: ursusflasher-kit
          fetch-depth: 1

      - name: Checkout XG-140G-MD OpenWrt tree
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPENWRT_REPO }}
          ref: ${{ env.OPENWRT_REF }}
          path: openwrt
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 python3-setuptools rsync \
            swig unzip zlib1g-dev file wget jq time

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure XG-140G-MD with LuCI
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_bell_xg-140g-md=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          EOF
          make defconfig
          echo '--- selected target ---'
          grep -E 'CONFIG_TARGET_airoha|bell_xg-140g-md' .config
          echo '--- LuCI ---'
          grep -E '^CONFIG_PACKAGE_luci(=|_)|^CONFIG_PACKAGE_uhttpd|^CONFIG_PACKAGE_rpcd' .config | sort || true
          grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_bell_xg-140g-md=y' .config
          grep -q '^CONFIG_PACKAGE_luci=y' .config

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8
          find dl -type f -size -1024c -delete

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log || {
            echo 'Parallel build failed; retrying single-threaded for diagnostics'
            make -j1 V=s 2>&1 | tee -a build.log
          }

      - name: Verify LuCI and collect images
        working-directory: openwrt
        run: |
          set -e
          TARGET_DIR="bin/targets/airoha/an7581"
          test -d "$TARGET_DIR"
          test -f "$TARGET_DIR/profiles.json"
          jq -e '.profiles | to_entries[] | select(.key | contains("bell_xg-140g-md"))' "$TARGET_DIR/profiles.json" >/dev/null

          mkdir -p ../artifact/images ../artifact/source ../artifact/buildinfo
          cp -av "$TARGET_DIR"/* ../artifact/images/
          cp -av target/linux/airoha/dts/an7581-xg-140g-md.dts ../artifact/source/
          cp -av .config ../artifact/buildinfo/openwrt.config
          cp -av build.log ../artifact/buildinfo/
          git rev-parse HEAD > ../artifact/buildinfo/openwrt.commit
          printf '%s\n' "$OPENWRT_REPO" > ../artifact/buildinfo/openwrt.repo
          printf '%s\n' "$PROFILE" > ../artifact/buildinfo/profile

          grep -q '^CONFIG_PACKAGE_luci=y' .config
          grep -q '^CONFIG_PACKAGE_luci-ssl=y' .config
          grep -q '^CONFIG_PACKAGE_luci-theme-bootstrap=y' .config

          (cd ../artifact && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          echo '--- artifact contents ---'
          find ../artifact -maxdepth 3 -type f -printf '%P\n' | sort

      - name: Build ready-to-run XG140 UART initramfs test kit
        run: |
          set -e
          TARGET_DIR="openwrt/bin/targets/airoha/an7581"
          INITRAMFS="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*bell_xg-140g-md-initramfs-uImage.itb' -print -quit)"
          test -n "$INITRAMFS"
          test -f "$INITRAMFS"

          mkdir -p artifact/tester/ursusflasher/src artifact/tester/ursusflasher/results
          cp -av ursusflasher-kit/START_XG140_INITRAMFS_TEST.cmd artifact/tester/
          cp -av ursusflasher-kit/ursusflasher/src/xg140_initramfs_test.py artifact/tester/ursusflasher/src/
          cp -av ursusflasher-kit/ursusflasher/src/console_ui.py artifact/tester/ursusflasher/src/
          cp -av ursusflasher-kit/ursusflasher/src/proven_backend.py artifact/tester/ursusflasher/src/
          cp -av ursusflasher-kit/ursusflasher/src/uart_bootarea_restore.py artifact/tester/ursusflasher/src/
          cp -av "$INITRAMFS" artifact/tester/

          cat > artifact/tester/README-XG140-RAM-TEST.txt <<'EOF'
          XG-140G-MD / XG140GMC2P5G initramfs RAM test

          1. Connect 3.3V UART: TX/RX/GND, 115200 8N1. Do not connect VCC.
          2. Close MobaXterm/PuTTY so the COM port is free.
          3. Run START_XG140_INITRAMFS_TEST.cmd.
          4. Select the COM port. The bundled initramfs is auto-detected; press Enter for it.
          5. Power-cycle the ONU when prompted.

          The tester stops stock tcboot autoboot, logs in, checks boardid XG140GMC2P5G,
          PCDDR4/512 MiB and stock tcboot fingerprint, transfers the FIT to RAM at 0x85000000,
          validates it with iminfo and boots it with bootm.

          This test does not issue NAND/flash write/erase, saveenv, bootflag swap, swimg or chpart.
          Power-cycle the ONU to return to the stock firmware.
          EOF

          (cd artifact/tester && sha256sum ./*initramfs*.itb > SHA256SUMS.txt)
          echo '--- tester contents ---'
          find artifact/tester -maxdepth 4 -type f -printf '%P\n' | sort

      - name: Upload XG-140G-MD LuCI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-xg-140g-md-luci-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          retention-days: 14
