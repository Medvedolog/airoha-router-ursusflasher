name: MF2 AN7583 source probe

on:
  push:
    branches: [ feature/mf-an7583 ]
    paths:
      - 'ursusboot/**'
      - '.github/workflows/mf2-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract TEST61 source snapshot
        run: |
          set -euxo pipefail
          rm -rf work/mf2-source-probe
          mkdir -p work/mf2-source-probe/src work/mf2-source-probe/out
          tar --zstd -xf ursusboot/source/ursusboot-0.1.0-alpha5-UBIUX1-TEST61-source.tar.zst -C work/mf2-source-probe/src
      - name: Verify AN7583 baseline exists
        run: |
          set -euxo pipefail
          S=work/mf2-source-probe/src
          test -f "$S/configs/an7583_nokia_xg-040g-mf_defconfig"
          test -f "$S/defenvs/an7583_nokia_xg-040g-mf_env"
          test -f "$S/arch/arm/dts/an7583-nokia-xg-040g-mf.dts"
          grep -q 'CONFIG_TARGET_AN7583=y' "$S/configs/an7583_nokia_xg-040g-mf_defconfig"
          grep -q 'compatible = "nokia,xg-040g-mf", "airoha,an7583"' "$S/arch/arm/dts/an7583-nokia-xg-040g-mf.dts"
      - name: Trace generated Ursus web UI
        run: |
          set -euxo pipefail
          S=work/mf2-source-probe/src
          O=work/mf2-source-probe/out
          {
            echo '=== files matching ursus/web/ui/html ==='
            find "$S" -type f \( -iname '*ursus*' -o -iname '*web*' -o -iname '*ui*' -o -iname '*.html' -o -iname '*.inc' \) | sort
            echo '=== references to generated include ==='
            grep -R -n -F 'ursusweb_ui.inc' "$S" --exclude='*.o' --exclude='*.bin' || true
            echo '=== source of exact MD UI strings ==='
            grep -R -n -E 'Nokia XG-040G-MD|openwrt-airoha-an7581-nokia_xg-040g-md-ubi-preloader.bin' "$S" --exclude='*.o' --exclude='*.bin' || true
            echo '=== likely generators/rules ==='
            grep -R -n -E 'ursusweb_ui|bin2c|xxd|filechk|html.*inc|web.*inc' "$S/Makefile" "$S/scripts" "$S/cmd" 2>/dev/null || true
          } | tee "$O/WEB_UI_GENERATOR.txt"
          while IFS= read -r f; do
            case "$f" in
              *.html|*.htm|*.js|*.css|*.py|*.sh|*.mk|*/Makefile|*.inc)
                rel=${f#"$S/"}
                mkdir -p "$O/generator/$(dirname "$rel")"
                cp "$f" "$O/generator/$rel"
                ;;
            esac
          done < <(grep -R -l -E 'Nokia XG-040G-MD|ursusweb_ui.inc|openwrt-airoha-an7581-nokia_xg-040g-md-ubi-preloader.bin' "$S" --exclude='*.o' --exclude='*.bin' || true)
      - name: Collect UrsusBoot writer API and board-specific entry points
        run: |
          set -euxo pipefail
          S=work/mf2-source-probe/src
          O=work/mf2-source-probe/out
          cp "$S/configs/an7583_nokia_xg-040g-mf_defconfig" "$O/"
          cp "$S/defenvs/an7583_nokia_xg-040g-mf_env" "$O/"
          cp "$S/arch/arm/dts/an7583-nokia-xg-040g-mf.dts" "$O/"
          mkdir -p "$O/cmd" "$O/drivers/gpio"
          cp "$S"/cmd/ursus*.c "$O/cmd/"
          cp "$S/cmd/Makefile" "$O/cmd/"
          cp "$S/include/ursus_version.h" "$O/"
          if [ -f "$S/drivers/gpio/ursus_an7581_safe_gpio.c" ]; then
            cp "$S/drivers/gpio/ursus_an7581_safe_gpio.c "$O/drivers/gpio/"
          fi
          cp "$S/drivers/gpio/Makefile" "$O/drivers/gpio/"
          cp "$S/drivers/gpio/Kconfig" "$O/drivers/gpio/" 2>/dev/null || true
          {
            echo '=== U_BOOT_CMD ==='
            grep -R -n 'U_BOOT_CMD' "$S/cmd" | grep -E 'ursus|ubi|mtd' || true
            echo '=== persistent APIs/commands in every Ursus source ==='
            grep -R -n -E 'saveenv|env_save|mtd_(erase|write)|mtd erase|mtd write|ubi_(create|remove|write|update|detach|attach)|ubi (write|create|remove|rename|detach)|ursus_.*(start|step|update|migration)' "$S"/cmd/ursus*.c || true
            echo '=== API routes ==='
            grep -n -E 'GET /api/|POST /api/' "$S/cmd/ursusweb.c" || true
            echo '=== AN7581 safe GPIO references ==='
            grep -R -n -E 'ursus_an7581_safe_gpio|AN7581_SAFE|TARGET_AN7581|TARGET_AN7583' "$S/drivers/gpio" "$S/cmd" "$S/arch/arm/dts/an7583-nokia-xg-040g-mf.dts" || true
          } > "$O/ENTRYPOINTS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: mf2-source-probe
          path: work/mf2-source-probe/out
          if-no-files-found: error
          retention-days: 7
