name: UrsusFlasher operator rollup overlay

on:
  push:
    branches:
      - feature/ursusboot-modular-airoha
    paths:
      - '.github/workflows/operator-rollup-overlay.yml'
      - 'START_*.cmd'
      - 'START_*.sh'
      - 'ursusflasher/src/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ursusflasher-operator-overlay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: operator rollup from last green TRANSITION2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current UrsusFlasher sources
        uses: actions/checkout@v4
        with:
          path: current
          fetch-depth: 1

      - name: Download last green TRANSITION2 operator kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p baseline
          gh run download 35112133778 \
            --repo "$GITHUB_REPOSITORY" \
            --name ursusflasher-md-ab-transition2-netdbg1-public-test-870cd49753c0b3e15508416b025f517a0a231014 \
            --dir baseline
          START="$(find baseline -type f -name START_EXPERT.cmd -print -quit)"
          test -n "$START"
          ROOT="$(dirname "$START")"
          test -d "$ROOT/ursusflasher/src"
          echo "ROLLUP_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "BASELINE_ROLLUP_ROOT=$ROOT"

      - name: Overlay current operator sources only
        run: |
          set -euxo pipefail
          rsync -a --delete current/ursusflasher/src/ "$ROLLUP_ROOT/ursusflasher/src/"
          for f in current/START_*.cmd current/START_*.sh; do
            test -f "$f" || continue
            cp "$f" "$ROLLUP_ROOT/"
          done
          printf '%s\n' "$GITHUB_SHA" > "$ROLLUP_ROOT/URSUSFLASHER_COMMIT.txt"
          cat > "$ROLLUP_ROOT/OPERATOR_OVERLAY_PROVENANCE.txt" <<EOF
          BASELINE_RUN=35112133778
          BASELINE_COMMIT=870cd49753c0b3e15508416b025f517a0a231014
          BASELINE_ARTIFACT=ursusflasher-md-ab-transition2-netdbg1-public-test-870cd49753c0b3e15508416b025f517a0a231014
          OPERATOR_SOURCE_COMMIT=${GITHUB_SHA}
          OVERLAY_SCOPE=ursusflasher/src,START_*.cmd,START_*.sh
          BINARY_PAYLOADS=UNCHANGED_FROM_BASELINE
          HARDWARE_STATUS=HW_PENDING
          EOF

      - name: Verify UART slot operator overlay
        run: |
          set -euxo pipefail
          test -f "$ROLLUP_ROOT/ursusflasher/src/stock_slot_uart.py"
          test -f "$ROLLUP_ROOT/ursusflasher/src/uart_prompt_fix.py"
          grep -F 'Переключить заводской SLOT через UART' "$ROLLUP_ROOT/ursusflasher/src/expert_multi.py"
          grep -F 'URSUS_STOCKSLOT_UART_DONE' "$ROLLUP_ROOT/ursusflasher/src/stock_slot_uart.py"
          grep -F 'uart_prompt_fix.install' "$ROLLUP_ROOT/ursusflasher/src/expert_airoha.py"
          python3 -m compileall -q "$ROLLUP_ROOT/ursusflasher/src"
          find "$ROLLUP_ROOT" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$ROLLUP_ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Regenerate package manifest
        run: |
          set -euxo pipefail
          rm -f "$ROLLUP_ROOT/SHA256SUMS"
          (cd "$ROLLUP_ROOT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$ROLLUP_ROOT" && sha256sum -c SHA256SUMS >/dev/null)
          du -sh "$ROLLUP_ROOT"

      - name: Upload operator rollup
        uses: actions/upload-artifact@v4
        with:
          name: UrsusFlasher-TRANSITION2-UART-STOCKSLOT-${{ github.sha }}
          path: ${{ env.ROLLUP_ROOT }}
          if-no-files-found: error
          retention-days: 14
