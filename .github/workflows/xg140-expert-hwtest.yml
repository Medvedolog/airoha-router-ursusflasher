name: XG140 UrsusFlasher EXPERT HW test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OPENWRT_REPO: hzyitc/openwrt-redmi-ax3000
      OPENWRT_REF: b27424f28a034ee1d18409b7952616ba9a40cca4
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev liblzma-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget jq time xz-utils zstd \
            device-tree-compiler perl

      - name: Validate host-side multimodel modules
        working-directory: kit
        run: |
          python3 -m py_compile \
            ursusflasher/src/bootloader_install_menu.py \
            ursusflasher/src/expert_airoha.py \
            ursusflasher/src/xg140_profile.py \
            ursusflasher/src/xg140_stock_transport.py \
            ursusflasher/src/xg140_runtime_install.py \
            ursusflasher/src/xg140_emergency_initramfs.py \
            ursusflasher/src/xg140_emergency_persistent.py \
            ursusflasher/src/xg140_native_persistent_install.py
          python3 ursusflasher/tools/selftest_xg140_native_fip_repack.py
          bash -n START_EXPERT.sh

      - name: Build XG140 persistent modular BL33
        working-directory: kit
        env:
          URSUS_RUNTIME_ROLE: persistent
        run: |
          set -euxo pipefail
          chmod +x ursusboot/scripts/build_xg140_native_profile.sh
          JOBS="$(nproc)" ursusboot/scripts/build_xg140_native_profile.sh 2>&1 | tee xg140-persistent-build.log
          OUT=work/xg140-native-profile-persistent/out
          test -s "$OUT/u-boot.bin"
          test -s "$OUT/u-boot.lzma"
          strings "$OUT/u-boot.bin" | grep -F 'URSUS_BOARD_PROFILE=xg140-md'
          strings "$OUT/u-boot.bin" | grep -F 'bootcmd=ursusdispatch'
          ! strings "$OUT/u-boot.bin" | grep -F 'bootcmd=ursusweb;true'

      - name: Stage XG140 persistent payload
        working-directory: kit
        run: |
          set -eux
          OUT=work/xg140-native-profile-persistent/out
          DST=payloads/xg140/ursusboot
          mkdir -p "$DST"
          cp "$OUT/u-boot.lzma" "$DST/u-boot.persistent.lzma"
          cp "$OUT/u-boot.bin" "$DST/u-boot.persistent.bin"
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          p = pathlib.Path('payloads/xg140/ursusboot/u-boot.persistent.lzma')
          raw = p.read_bytes()
          info = {
              'schema': 1,
              'board_profile': 'xg140-md',
              'runtime_role': 'persistent',
              'size': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
              'source_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'hardware_status': 'HW_PENDING_PERSISTENT_COLD_BOOT',
          }
          pathlib.Path('payloads/xg140/ursusboot/BUILD_INFO.json').write_text(
              json.dumps(info, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(info, indent=2))
          PY
          PYTHONPATH=ursusflasher/src python3 - <<'PY'
          import xg140_profile
          p, info = xg140_profile.require_bl33()
          print('XG140_PAYLOAD_GATE=PASS', p, info['sha256'])
          PY

      - name: Checkout XG140 OpenWrt tree
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPENWRT_REPO }}
          ref: ${{ env.OPENWRT_REF }}
          path: openwrt
          fetch-depth: 1

      - name: Prepare XG140 rescue initramfs
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('openwrt/target/linux/airoha/dts/an7581-xg-140g-md.dts')
          s = p.read_text()
          start = s.index('partition@0 {\n\t\t\tlabel = "bootloader";')
          end = s.index('\n\t\t};', start) + len('\n\t\t};')
          block = s[start:end]
          if '\n\t\t\tread-only;' in block:
              block = block.replace('\n\t\t\tread-only;', '', 1)
              s = s[:start] + block + s[end:]
              p.write_text(s)
          PY
          mkdir -p openwrt/files/usr/sbin openwrt/files/etc
          cp kit/openwrt/xg140-rescue/xg140-ursus-install openwrt/files/usr/sbin/
          cp kit/openwrt/xg140-rescue/ursus-xg140-rescue-id openwrt/files/etc/
          chmod 0755 openwrt/files/usr/sbin/xg140-ursus-install

      - name: Configure rescue initramfs
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_bell_xg-140g-md=y
          CONFIG_PACKAGE_mtd=y
          CONFIG_BUSYBOX_CUSTOM=y
          CONFIG_BUSYBOX_CONFIG_RX=y
          EOF
          make defconfig
          grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_bell_xg-140g-md=y' .config
          grep -q '^CONFIG_PACKAGE_mtd=y' .config
          grep -q '^CONFIG_BUSYBOX_CUSTOM=y' .config
          grep -q '^CONFIG_BUSYBOX_CONFIG_RX=y' .config

      - name: Download OpenWrt sources
        working-directory: openwrt
        run: |
          make download -j8
          find dl -type f -size -1024c -delete

      - name: Build rescue initramfs
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee ../xg140-rescue-openwrt-build.log || {
            make -j1 V=s 2>&1 | tee -a ../xg140-rescue-openwrt-build.log
          }

      - name: Stage rescue payload
        run: |
          set -eux
          TARGET_DIR=openwrt/bin/targets/airoha/an7581
          INITRAMFS="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*bell_xg-140g-md-initramfs-uImage.itb' -print -quit)"
          test -n "$INITRAMFS"
          test -s "$INITRAMFS"
          mkdir -p kit/payloads/xg140/rescue
          cp "$INITRAMFS" kit/payloads/xg140/rescue/xg140-rescue-initramfs.itb

      - name: Build runnable multimodel operator kit
        run: |
          set -euxo pipefail
          ART=/tmp/ursusflasher-airoha-expert
          rm -rf "$ART"
          mkdir -p "$ART"
          cd kit
          cp -a START_*.cmd START_*.sh VERSION README.md "$ART/"
          cp -a config fw payloads ursusflasher docs "$ART/"
          cp payloads/xg140/rescue/xg140-rescue-initramfs.itb "$ART/ursusflasher/xg140-rescue-initramfs.itb"
          cp payloads/xg140/ursusboot/u-boot.persistent.lzma "$ART/ursusflasher/u-boot.lzma"
          cp ursusflasher/tools/repack_xg140_native_fip.py "$ART/ursusflasher/repack_xg140_native_fip.py"
          cat > "$ART/ursusflasher/emergency.local.example.json" <<'EOF'
          {
            "host": "192.168.1.1",
            "port": "auto",
            "backup": "C:\\path\\to\\this-router\\mtd0_bootloader.bin.gz",
            "tcboot_user": "",
            "tcboot_password": ""
          }
          EOF
          find "$ART" -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find "$ART" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          cat > "$ART/README-XG140-HWTEST.txt" <<'EOF'
          UrsusFlasher Airoha multimodel EXPERT/HWTEST

          All menu actions remain selectable. Probe/policy state is advisory in this
          engineering kit; concrete backends stop only when the requested transport
          or the immediate flash target cannot actually be used.

          XG140 persistent install:
            START_EXPERT.cmd -> 2 -> model XG140 -> choose Telnet or UART.

          UART path for a non-booting XG140:
            tcboot -> XMODEM rescue Linux FIT -> bootm -> XMODEM native-hybrid FIP
            -> 512 KiB boot-area write -> full readback -> reboot.

          It does NOT use the rejected tcboot `go` raw nested-U-Boot path.
          Before destructive boot-area write the remaining hard invariants are the
          actual 512-KiB target geometry, structurally valid device-derived FIP and
          full post-write readback. No alternate writer is retried after write starts.
          EOF
          git rev-parse HEAD > "$ART/URSUSFLASHER_COMMIT.txt"
          cp xg140-persistent-build.log "$ART/"
          cp ../xg140-rescue-openwrt-build.log "$ART/"
          (cd "$ART" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Verify packaged runtime
        run: |
          set -eux
          ART=/tmp/ursusflasher-airoha-expert
          test -f "$ART/START_EXPERT.cmd"
          grep -Fq 'expert_airoha.py' "$ART/START_EXPERT.cmd"
          test -f "$ART/ursusflasher/src/expert_airoha.py"
          test -f "$ART/ursusflasher/src/bootloader_install_menu.py"
          test -f "$ART/ursusflasher/src/xg140_emergency_initramfs.py"
          test -f "$ART/ursusflasher/src/xg140_runtime_install.py"
          test -s "$ART/ursusflasher/xg140-rescue-initramfs.itb"
          test -s "$ART/ursusflasher/u-boot.lzma"
          test -f "$ART/ursusflasher/repack_xg140_native_fip.py"
          test -s "$ART/payloads/xg140/ursusboot/u-boot.persistent.lzma"
          (cd "$ART" && PYTHONPATH=ursusflasher/src python3 - <<'PY'
          import bootloader_install_menu
          import expert_airoha
          import xg140_profile
          import xg140_runtime_install
          import xg140_emergency_initramfs
          p, info = xg140_profile.require_bl33()
          assert info['board_profile'] == 'xg140-md'
          assert info['runtime_role'] == 'persistent'
          print('PACKAGED_XG140_RUNTIME_IMPORT=PASS', p, info['sha256'])
          PY
          )
          (cd "$ART" && sha256sum -c SHA256SUMS >/dev/null)
          du -sh "$ART"

      - name: Upload operator kit
        uses: actions/upload-artifact@v4
        with:
          name: UrsusFlasher-Airoha-Multimodel-HWTEST-${{ github.sha }}
          path: /tmp/ursusflasher-airoha-expert
          if-no-files-found: error
          retention-days: 14
