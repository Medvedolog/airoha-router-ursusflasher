name: XG140 UrsusFlasher EXPERT HW test

on:
  push:
    branches:
      - feature/ursusboot-modular-airoha
    paths:
      - 'START_EXPERT.cmd'
      - 'START_EXPERT.sh'
      - 'config/BOARD_PROFILES.json'
      - 'scripts/repo_common.py'
      - 'ursusflasher/src/bootloader_install_menu.py'
      - 'ursusflasher/src/expert_airoha.py'
      - 'ursusflasher/src/xg140_profile.py'
      - 'ursusflasher/src/xg140_stock_transport.py'
      - 'ursusflasher/src/xg140_runtime_install.py'
      - 'ursusflasher/src/ursusboot_install.py'
      - 'ursusflasher/tools/repack_xg140_native_fip.py'
      - 'ursusflasher/tools/selftest_xg140_native_fip_repack.py'
      - 'ursusboot/configs/**'
      - 'ursusboot/board-policies/**'
      - 'ursusboot/scripts/**'
      - '.github/workflows/xg140-expert-hwtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make perl python3 xz-utils zstd liblzma-dev device-tree-compiler

      - name: Validate host-side multimodel modules
        run: |
          python3 -m py_compile \
            ursusflasher/src/bootloader_install_menu.py \
            ursusflasher/src/expert_airoha.py \
            ursusflasher/src/xg140_profile.py \
            ursusflasher/src/xg140_stock_transport.py \
            ursusflasher/src/xg140_runtime_install.py
          python3 ursusflasher/tools/selftest_xg140_native_fip_repack.py
          bash -n START_EXPERT.sh

      - name: Build XG140 persistent modular BL33
        env:
          URSUS_RUNTIME_ROLE: persistent
        run: |
          set -euxo pipefail
          chmod +x ursusboot/scripts/build_xg140_native_profile.sh
          JOBS="$(nproc)" ursusboot/scripts/build_xg140_native_profile.sh 2>&1 | tee xg140-persistent-build.log
          OUT=work/xg140-native-profile-persistent/out
          test -s "$OUT/u-boot.bin"
          test -s "$OUT/u-boot.lzma"
          strings "$OUT/u-boot.bin" | grep -F 'URSUS_BOARD_PROFILE=xg140-md'
          strings "$OUT/u-boot.bin" | grep -F 'bootcmd=ursusdispatch'
          ! strings "$OUT/u-boot.bin" | grep -F 'bootcmd=ursusweb;true'

      - name: Stage XG140 payload for UrsusFlasher
        run: |
          set -eux
          OUT=work/xg140-native-profile-persistent/out
          DST=payloads/xg140/ursusboot
          mkdir -p "$DST"
          cp "$OUT/u-boot.lzma" "$DST/u-boot.persistent.lzma"
          cp "$OUT/u-boot.bin" "$DST/u-boot.persistent.bin"
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          p = pathlib.Path('payloads/xg140/ursusboot/u-boot.persistent.lzma')
          raw = p.read_bytes()
          info = {
              'schema': 1,
              'board_profile': 'xg140-md',
              'runtime_role': 'persistent',
              'size': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
              'source_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'hardware_status': 'HW_PENDING_PERSISTENT_COLD_BOOT',
          }
          pathlib.Path('payloads/xg140/ursusboot/BUILD_INFO.json').write_text(
              json.dumps(info, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(info, indent=2))
          PY
          PYTHONPATH=ursusflasher/src python3 - <<'PY'
          import xg140_profile
          p, info = xg140_profile.require_bl33()
          print('XG140_PAYLOAD_GATE=PASS', p, info['sha256'])
          PY

      - name: Build runtime operator kit
        run: |
          set -eux
          ART=/tmp/xg140-ursusflasher-expert
          rm -rf "$ART"
          PYTHONPATH=scripts python3 - <<'PY'
          from pathlib import Path
          import shutil
          import repo_common

          art = Path('/tmp/xg140-ursusflasher-expert')
          repo_common.RELEASE_PAYLOADS = tuple(repo_common.RELEASE_PAYLOADS) + (
              'payloads/xg140/ursusboot/u-boot.persistent.lzma',
              'payloads/xg140/ursusboot/u-boot.persistent.bin',
              'payloads/xg140/ursusboot/BUILD_INFO.json',
          )
          repo_common.export_tree(art)
          tools = art / 'data' / 'tools'
          tools.mkdir(parents=True, exist_ok=True)
          shutil.copy2('ursusflasher/tools/repack_xg140_native_fip.py', tools / 'repack_xg140_native_fip.py')
          (art / 'README-XG140-HWTEST.txt').write_text(
              'XG140 UrsusBoot persistent hardware test\n\n'
              'Run: START_EXPERT.cmd\n'
              'Choose: 2 - Install/update UrsusBoot\n'
              'Model: 1 - Auto (XG140) or 4 - Bell/Nokia XG-140G-MD\n'
              'Transport: 1 - Telnet / Nokia stock\n\n'
              "The installer reads the live 512-KiB mtd0 first, rebuilds THIS DEVICE'S\n"
              'native FIP by replacing only NT_FW/BL33, preserves the live 0x000..0x7ff\n'
              'prefix and 0x7c000..0x7ffff vendor env, writes once, then requires a full\n'
              '512-KiB SHA256 readback before offering reboot.\n\n'
              'XG140 UART persistent install is intentionally disabled in this kit:\n'
              'tcboot -> go raw u-boot has already been rejected on real hardware.\n',
              encoding='utf-8')
          shutil.copy2('xg140-persistent-build.log', art / 'xg140-persistent-build.log')
          (art / 'URSUSFLASHER_COMMIT.txt').write_text(
              __import__('subprocess').check_output(['git','rev-parse','HEAD'], text=True), encoding='utf-8')
          repo_common.write_manifest(art)
          PY

      - name: Verify packaged runtime
        run: |
          set -eux
          ART=/tmp/xg140-ursusflasher-expert
          test -f "$ART/START_EXPERT.cmd"
          grep -Fq 'expert_airoha.py' "$ART/START_EXPERT.cmd"
          test -f "$ART/data/expert_airoha.py"
          test -f "$ART/data/bootloader_install_menu.py"
          test -f "$ART/data/xg140_runtime_install.py"
          test -f "$ART/data/xg140_profile.py"
          test -f "$ART/data/tools/repack_xg140_native_fip.py"
          test -s "$ART/data/payloads/xg140/ursusboot/u-boot.persistent.lzma"
          test -f "$ART/data/payloads/xg140/ursusboot/BUILD_INFO.json"
          (cd "$ART" && PYTHONPATH=data python3 - <<'PY'
          import bootloader_install_menu
          import xg140_profile
          import xg140_runtime_install
          p, info = xg140_profile.require_bl33()
          assert info['board_profile'] == 'xg140-md'
          assert info['runtime_role'] == 'persistent'
          print('PACKAGED_XG140_RUNTIME_IMPORT=PASS', p, info['sha256'])
          PY
          )
          (cd "$ART" && sha256sum -c SHA256SUMS >/dev/null)
          du -sh "$ART"

      - name: Upload operator kit
        uses: actions/upload-artifact@v4
        with:
          name: XG140-UrsusFlasher-EXPERT-${{ github.sha }}
          path: /tmp/xg140-ursusflasher-expert
          if-no-files-found: error
          retention-days: 14
