name: Python compatibility

on:
  push:
    branches: [ main, master, feature/ursusboot-modular-airoha ]
    paths:
      - '**/*.py'
      - '.github/workflows/python-compat.yml'
  pull_request:
    paths:
      - '**/*.py'
      - '.github/workflows/python-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show interpreter
        run: python3 --version
      - name: Compile host Python tree
        run: python3 -m compileall -q scripts ursusflasher
      - name: Import canonical host modules
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: ursusflasher/src
        run: |
          python3 - <<'PY'
          import importlib
          modules = (
              "console_ui",
              "device_state",
              "network_guidance",
              "ursus_web_client",
              "one_key_multi",
              "expert_multi",
              "ursusboot_pregnant",
              "mf_runtime_install",
          )
          for name in modules:
              importlib.import_module(name)
              print(f"IMPORT_OK {name}")
          PY
      - name: UrsusBoot WebSocket console client selftest
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: ursusflasher/src
        run: python3 ursusflasher/tools/selftest_ws_console.py
      - name: UrsusBoot HTTP streaming backup client selftest
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: ursusflasher/src
        run: python3 ursusflasher/tools/selftest_http_backup.py
      - name: UrsusBoot FIP identification and chooser selftest
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: ursusflasher/src
        run: |
          NOKIA_LANG=ru python3 ursusflasher/tools/selftest_fip_choice.py
          NOKIA_LANG=en python3 ursusflasher/tools/selftest_fip_choice.py
