name: Vanilla OpenWrt MD U-Boot + Fudan

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ursusboot-modular-airoha
    paths:
      - '.github/workflows/openwrt-vanilla-md-fudan.yml'
      - 'openwrt/patches/24025.patch'

permissions:
  contents: read

env:
  OPENWRT_REF: 3d1645ee26d6a2e20be71d7fa1716721bac78e53

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: ${{ env.OPENWRT_REF }}
          path: openwrt
          fetch-depth: 1
      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev liblzma-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget jq time xz-utils zstd device-tree-compiler perl
      - name: Fudan patch and target config
        working-directory: openwrt
        run: |
          set -eux
          git apply --check ../kit/openwrt/patches/24025.patch
          git apply ../kit/openwrt/patches/24025.patch
          cat > .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y
          EOF
          make defconfig
          test -f package/boot/uboot-airoha/patches/120-mtd-spinand-fmsh-add-support-for-FM25G01B-FM25G02B.patch
          test -f package/boot/uboot-airoha/patches/121-mtd-spinand-fmsh-fix-FM25G01B-FM25G02B-Quad-IO-read-dummy-cycles.patch
      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8
          find dl -type f -size -1024c -delete
      - name: Build OpenWrt host tools
        working-directory: openwrt
        run: |
          make -j"$(nproc)" tools/install V=s || make -j1 tools/install V=s
          test -x staging_dir/host/bin/sed
          test -x staging_dir/host/bin/openssl
      - name: Build OpenWrt toolchain
        working-directory: openwrt
        run: |
          make -j"$(nproc)" toolchain/install V=s || make -j1 toolchain/install V=s
      - name: Build Nokia XG-040G-MD U-Boot only
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j"$(nproc)" package/boot/uboot-airoha/compile V=s 2>&1 | tee ../u-boot-build.log || make -j1 package/boot/uboot-airoha/compile V=s 2>&1 | tee -a ../u-boot-build.log
      - name: Verify and stage
        run: |
          set -eux
          mkdir -p out
          D="$(find openwrt/build_dir -type d -path '*uboot-airoha*' -name 'u-boot-2026.07' -print | head -n1)"
          if [ -z "$D" ]; then D="$(find openwrt/build_dir -type d -path '*uboot-airoha*' -print | head -n1)"; fi
          BIN="$(find "$D" -type f -name u-boot.bin -print | head -n1)"
          LZMA="$(find "$D" -type f -name u-boot.lzma -print | head -n1)"
          test -s "$BIN"
          test -s "$LZMA"
          strings "$BIN" | grep -F 'U-Boot 2026.07' | head -n1
          grep -R -F 'FM25G01B' "$D" | head -n1
          grep -R -F 'FM25G02B' "$D" | head -n1
          cp "$BIN" out/openwrt-vanilla-an7581-nokia-xg040md-fudan-u-boot.bin
          cp "$LZMA" out/openwrt-vanilla-an7581-nokia-xg040md-fudan-u-boot.lzma
          sha256sum out/*.bin out/*.lzma | tee out/SHA256SUMS
          cat > out/BUILD_INFO.txt <<EOF
          ROLE=VANILLA_OPENWRT_FINAL_BOOTLOADER
          TARGET=Nokia XG-040G-MD
          SOC=Airoha AN7581
          UBOOT=2026.07
          OPENWRT_REF=${OPENWRT_REF}
          FUDAN_PATCH_SHA256=$(sha256sum kit/openwrt/patches/24025.patch | awk '{print $1}')
          PATCH_SUPPORT=FM25G01B,FM25G02B
          URSUSBOOT=NO
          HARDWARE_STATUS=HW_PENDING
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-vanilla-md-fudan-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 14
