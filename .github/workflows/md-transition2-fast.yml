name: EXPERT item4 TRANSITION2 no-UART kit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ursusboot-modular-airoha
    paths:
      - '.github/workflows/md-transition2-fast.yml'
      - 'START_EXPERT.cmd'
      - 'START_EXPERT.sh'
      - 'ursusboot/configs/ursusboot-transition-handoff.cfg'
      - 'ursusboot/patches/190-md-transition1-handoff.patch'
      - 'ursusboot/patches/200-transition2-uart-fallback.patch'
      - 'ursusboot/patches/205-transition2-an7581-gdm1-enable.patch'
      - 'ursusboot/patches/210-transition2-netdbg1-netreset.patch'
      - 'ursusboot/patches/220-transition2-stockslot-command.patch'
      - 'ursusboot/scripts/build_md_transition1.sh'
      - 'ursusboot/source/ursusboot-0.1.0-alpha5-UBIUX1-TEST61-source.tar.zst'
      - 'ursusflasher/src/backup_progress.py'
      - 'ursusflasher/src/transition_trace.py'
      - 'ursusflasher/src/transition_fastpath.py'
      - 'ursusflasher/src/device_state.py'
      - 'ursusflasher/src/expert.py'
      - 'ursusflasher/src/expert_airoha.py'
      - 'ursusflasher/src/expert_multi.py'
      - 'ursusflasher/src/stock_ab_transition.py'
      - 'ursusflasher/src/stock_fit_wrapper.py'
      - 'ursusflasher/src/stock_slot_uart.py'
      - 'ursusflasher/src/stock_slot_telnet.py'
      - 'ursusflasher/tools/selftest_backup_progress.py'
      - 'ursusflasher/tools/selftest_transition_trace.py'
      - 'ursusflasher/tools/selftest_transition_expert_item4.py'
      - 'ursusflasher/tools/selftest_transition_family_metadata.py'
      - 'ursusflasher/tools/selftest_transition_write_safety.py'
      - 'ursusflasher/tools/selftest_expert_launcher_item4.py'
      - 'ursusflasher/tools/selftest_stateui6_action_preflight.py'
      - 'ursusflasher/tools/selftest_device_state_v529.py'
      - 'config/**'

permissions:
  contents: read
  actions: read

jobs:
  transition2-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make perl python3 git patch xz-utils zstd liblzma-dev device-tree-compiler zip

      - name: Python syntax and host contract QA
        run: |
          python3 -m py_compile \
            ursusflasher/src/backup_progress.py \
            ursusflasher/src/transition_trace.py \
            ursusflasher/src/transition_fastpath.py \
            ursusflasher/src/device_state.py \
            ursusflasher/src/expert.py \
            ursusflasher/src/expert_airoha.py \
            ursusflasher/src/expert_multi.py \
            ursusflasher/src/stock_ab_transition.py \
            ursusflasher/src/stock_fit_wrapper.py \
            ursusflasher/src/stock_slot_uart.py \
            ursusflasher/src/stock_slot_telnet.py \
            ursusflasher/tools/selftest_backup_progress.py \
            ursusflasher/tools/selftest_transition_trace.py \
            ursusflasher/tools/selftest_transition_expert_item4.py \
            ursusflasher/tools/selftest_transition_family_metadata.py \
            ursusflasher/tools/selftest_transition_write_safety.py \
            ursusflasher/tools/selftest_expert_launcher_item4.py \
            ursusflasher/tools/selftest_stateui6_action_preflight.py \
            ursusflasher/tools/selftest_device_state_v529.py
          python3 ursusflasher/tools/selftest_backup_progress.py
          python3 ursusflasher/tools/selftest_transition_trace.py
          python3 ursusflasher/tools/selftest_transition_expert_item4.py
          python3 ursusflasher/tools/selftest_transition_family_metadata.py
          python3 ursusflasher/tools/selftest_transition_write_safety.py
          python3 ursusflasher/tools/selftest_expert_launcher_item4.py
          python3 ursusflasher/tools/selftest_stateui6_action_preflight.py
          python3 ursusflasher/tools/selftest_device_state_v529.py

      - name: Build TRANSITION2
        run: |
          bash ursusboot/scripts/build_md_transition1.sh
          test -s work/md-transition2/out/ursusboot-md-0.1.0-alpha5-UBIUX1-TRANSITION2.linuximg
          grep -Fq 'TRANSITION_ENTRY=ursusdispatch->net-sanitize->ursusweb' work/md-transition2/out/TRANSITION2-BUILD_INFO.txt
          grep -Fq 'HANDOFF_ONLY=0' work/md-transition2/out/TRANSITION2-BUILD_INFO.txt

      - name: Stage payload and metadata
        run: |
          set -eux
          mkdir -p payloads/md/transition
          rm -f payloads/md/transition/ursusboot-md-0.1.0-alpha5-UBIUX1-TRANSITION1.linuximg payloads/md/transition/TRANSITION1.json
          cp work/md-transition2/out/ursusboot-md-0.1.0-alpha5-UBIUX1-TRANSITION2.linuximg payloads/md/transition/
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          p=pathlib.Path('payloads/md/transition/ursusboot-md-0.1.0-alpha5-UBIUX1-TRANSITION2.linuximg')
          info={
            'schema':2,'board':'MD','board_profile':'xg040-md','mode':'TRANSITION',
            'product_lifecycle':'transition','persistence_target':'NONE',
            'final_target':'VANILLA_OPENWRT_UBI','stock_inner_format':'ARM64_LINUX_IMAGE_HANDOFF',
            'stock_kernel_load':'0x80088000','text_base':'0x81e00000',
            'transition_entry':'ursusdispatch->ursusweb','handoff_only':False,
            'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'hardware_status':'HW_PENDING_EXPERT_ITEM4_TRANSITION2_WEB'
          }
          pathlib.Path('payloads/md/transition/TRANSITION2.json').write_text(json.dumps(info,indent=2)+'\n')
          PY
          PYTHONPATH=ursusflasher/src python3 - <<'PY'
          import stock_ab_transition
          policy=stock_ab_transition._policy('xg040-md')
          data, meta=stock_ab_transition._load_payload(policy)
          assert meta['product_lifecycle']=='transition'
          assert 'runtime_role' not in meta
          assert meta['transition_entry']=='ursusdispatch->ursusweb'
          assert meta['handoff_only'] is False
          assert meta['final_target']=='VANILLA_OPENWRT_UBI'
          print('TRANSITION2_QA=PASS', len(data), meta['sha256'])
          PY

      - name: Assemble EXPERT item4 test kit
        run: |
          set -eux
          ART=/tmp/ursus-transition2-expert
          rm -rf "$ART"
          mkdir -p "$ART"
          cp -a START_EXPERT.cmd START_EXPERT.sh VERSION README.md "$ART/"
          cp -a config fw payloads ursusflasher docs "$ART/"
          cat > "$ART/TRANSITION2-READ-ME-FIRST.txt" <<EOF
          UrsusFlasher EXPERT ITEM 4 - MD TRANSITION2 NO-UART TEST KIT
          Source commit: ${GITHUB_SHA}

          Operator entry:
            START_EXPERT -> item 4 -> Stock Nokia -> Vanilla OpenWrt (TRANSITION)

          Before first run on Nokia stock:
            router powered on -> hold Reset >=30 seconds -> release -> wait for full stock Web UI.

          Host preflight contract:
            confirmed xg040-md stock profile
            complete proven all-/proc/mtd backup and validation
            structural stock FIP/HDR2/FIT validation
            TRANSITION2 injected as compression=none with hash update
            proven transfer backend selected and both candidate files SHA-verified before y/N
            writer and transfer backend frozen before destructive boundary
            one ordinary y/N
            operator trace shows payload/source, per-device SLOT2 build, selector BEFORE/AFTER, exact write target/writer and full readback SHA
            exact destructive targets: nsb_slave then flag; nsb_master and flagback untouched
            full nsb_slave readback mismatch aborts before selector write
            a stock reset may clear /tmp; after reconnect the already written SLOT2 is SHA-checked, matching data is not rewritten, and the next frozen payload is re-uploaded with the same transport before selector write
            flag readback mismatch aborts completion
            item 13 offers either stock root Telnet or USB-UART/U-Boot selector switching; both change active only and never write flagback/NSB slots
            shipped START_EXPERT -> expert_airoha -> expert_multi item 4 routing is behavior-tested
            missing/unknown stock Web family metadata is tolerated only after exact model/root proof and stock MTD geometry validation
            canonical registry is item4=vanilla_transition and item9=restore_factory_bootarea

          Previous hardware evidence remains limited to the bootstrap mechanism:
            tcboot can select SLOT2, stock-compatible FIT/hash passes, TRANSITION shim starts,
            Fudan NAND is detected, and failed SLOT2 attempts roll back to untouched SLOT1.

          THIS EXPERT ITEM4 ORCHESTRATION BUILD IS HW_PENDING.
          CI/package PASS is not HW PASS.
          EOF
          find "$ART" -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find "$ART" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git rev-parse HEAD > "$ART/URSUSFLASHER_COMMIT.txt"
          (cd "$ART" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cd /tmp
          zip -qr UrsusFlasher-EXPERT-ITEM4-MD-TRANSITION2-${GITHUB_SHA}.zip ursus-transition2-expert
          sha256sum UrsusFlasher-EXPERT-ITEM4-MD-TRANSITION2-${GITHUB_SHA}.zip > UrsusFlasher-EXPERT-ITEM4-MD-TRANSITION2-${GITHUB_SHA}.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: UrsusFlasher-EXPERT-ITEM4-MD-TRANSITION2-${{ github.sha }}
          path: |
            /tmp/UrsusFlasher-EXPERT-ITEM4-MD-TRANSITION2-${{ github.sha }}.zip
            /tmp/UrsusFlasher-EXPERT-ITEM4-MD-TRANSITION2-${{ github.sha }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
